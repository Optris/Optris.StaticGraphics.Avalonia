name: 🔭 Avalonia watch

# Avalonia is the upstream this fork actually follows, and SkiaSharp is a consequence of it.
# This used to watch SkiaSharp directly, which was the wrong question twice over: a SkiaSharp
# release Avalonia has not adopted is not something we can ship - the managed bindings a
# consumer gets come from Avalonia.Skia's dependency, and building a native library from a
# different major than those bindings expect is exactly the mismatch that reached us once
# already. Under the current design preflight would refuse such a build outright.
#
# So the question is "has Avalonia's newest MAJOR moved past what we have published", and the
# SkiaSharp version is read off that Avalonia rather than chosen beside it.
#
# The comparison stays between two facts that cannot drift: what is on nuget.org upstream, and
# what we have actually published. Anything derived from repo state - a marker file, a pinned
# property, the last tag - can be edited or reverted, and would then either miss a release or
# rebuild for ever.

on:
  schedule:
    # Avalonia ships more often than SkiaSharp but still in weeks, not hours, so daily polling
    # costs one ~15 second job and bounds the delay at 24 hours. Note GitHub disables cron on
    # repos idle for 60 days.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would happen without starting a build
        required: false
        default: false
        type: boolean

concurrency:
  group: avalonia-watch
  cancel-in-progress: false

jobs:
  check:
    name: 🔭 Check for a new Avalonia
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      avalonia_version: ${{ steps.check.outputs.avalonia_version }}
      skiasharp_version: ${{ steps.check.outputs.skiasharp_version }}
      build_rev: ${{ steps.check.outputs.build_rev }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: 🔭 Compare upstream against what we shipped
        id: check
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          def versions(package_id):
              url = f"https://api.nuget.org/v3-flatcontainer/{package_id.lower()}/index.json"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return json.load(response).get("versions", [])
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return []
                  sys.exit(f"::error::nuget.org returned HTTP {error.code} for {package_id}.")
              except Exception as error:  # noqa: BLE001
                  sys.exit(f"::error::Could not reach nuget.org for {package_id}: {error}")

          # The flat container lists versions in ascending SemVer order.
          stable = [version for version in versions("Avalonia") if "-" not in version]
          if not stable:
              sys.exit("::error::nuget.org returned no stable Avalonia versions.")

          # The newest MAJOR, not merely the newest version. Avalonia maintains several majors
          # at once, and a patch to an older line is not what these packages track.
          newest_major = max(int(version.split(".")[0]) for version in stable)
          avalonia = [v for v in stable if int(v.split(".")[0]) == newest_major][-1]

          # Whatever that Avalonia depends on is what has to be compiled. Read, never assumed:
          # the two being chosen independently is the defect this watch was rewritten to prevent.
          nuspec_url = f"https://api.nuget.org/v3-flatcontainer/avalonia.skia/{avalonia}/avalonia.skia.nuspec"
          try:
              with urllib.request.urlopen(nuspec_url, timeout=30) as response:
                  nuspec = response.read().decode("utf-8")
          except Exception as error:  # noqa: BLE001
              sys.exit(f"::error::Could not read {nuspec_url}: {error}")
          found = re.search(r'id="SkiaSharp"\s+version="([^"]+)"', nuspec)
          if not found:
              sys.exit(
                  f"::error::Avalonia.Skia {avalonia} declares no SkiaSharp dependency. Refusing to "
                  "guess one - that guess is precisely what this watch exists to avoid."
              )
          skiasharp = found.group(1)

          # Our package version is <skiasharp>.<rev>, so "have we shipped for this Avalonia" is
          # answered by whether we have shipped for the SkiaSharp it needs.
          shipped = versions("Optris.StaticGraphics.Avalonia.Vulkan")
          matching = [version for version in shipped if version.startswith(f"{skiasharp}.")]
          revisions = []
          for version in matching:
              parts = version.split(".")
              if len(parts) == 4 and parts[3].isdigit():
                  revisions.append(int(parts[3]))

          should_build = not matching
          build_rev = (max(revisions) + 1) if revisions else 1

          outputs = {
              "avalonia_version": avalonia,
              "skiasharp_version": skiasharp,
              "build_rev": str(build_rev),
              "should_build": str(should_build).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"Latest stable Avalonia major: **{avalonia}**, which depends on SkiaSharp "
                  f"**{skiasharp}**.\n\n"
              )
              if matching:
                  handle.write(f"Already shipped as: {', '.join(matching)}. Nothing to do.\n")
              else:
                  handle.write(
                      f"Not shipped yet. Starting a validation build for **{skiasharp}.{build_rev}**.\n\n"
                      "To release it: set `BuildRev` to "
                      f"`{build_rev}` in the packaging project and review "
                      "`OptrisStaticGraphicsAngleBranch`, which usually moves with a new Skia, then "
                      f"tag `v{skiasharp}.{build_rev}`. `SkiaSharpVersion` needs no edit - preflight "
                      "derives it from Avalonia.\n"
                  )
          PY

  build:
    name: 🧪 Validation build
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' && inputs.dry_run != true }}
    # Calling the release workflow instead of dispatching it keeps everything in one run and
    # sidesteps the question of whether GITHUB_TOKEN may start another workflow.
    # A called workflow can never hold more permission than its caller, so grant what the
    # release job declares even though this run never reaches it.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      # The Avalonia line is passed, not the SkiaSharp version: preflight derives that, and
      # passing both would reintroduce the two-sources-of-truth problem in the one workflow
      # written to remove it.
      avalonia_version: ${{ needs.check.outputs.avalonia_version }}
      build_rev: ${{ needs.check.outputs.build_rev }}
      publish_to_nuget: false
      publish_to_release: false
      allow_republish: false
    secrets: inherit
