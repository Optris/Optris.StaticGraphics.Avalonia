name: 🔭 Avalonia watch

# Avalonia is the upstream this fork actually follows, and SkiaSharp is a consequence of it.
# This used to watch SkiaSharp directly, which was the wrong question twice over: a SkiaSharp
# release Avalonia has not adopted is not something we can ship - the managed bindings a
# consumer gets come from Avalonia.Skia's dependency, and building a native library from a
# different major than those bindings expect is exactly the mismatch that reached us once
# already. Under the current design preflight would refuse such a build outright.
#
# So the question is "has Avalonia's newest MAJOR moved past what we last VALIDATED", and the
# SkiaSharp version is read off that Avalonia rather than chosen beside it.
#
# Validated, not published, and the difference matters: most Avalonia patches keep the same
# SkiaSharp, so a published-version comparison would skip them and we would be claiming
# compatibility with releases nothing had ever rendered a frame against. The payload is genuinely
# unchanged in that case; what changed is how Avalonia CALLS it.
#
# The record of what was validated is the NAME of an artifact written by the last successful run,
# looked up by exact name. Deliberately not repo state - a marker file can be edited or reverted, which would either miss a
# release or rebuild for ever - and deliberately not downloaded, since the name carries the whole
# answer. An expired or missing marker reads as "not validated", so the failure direction is a
# redundant build rather than a silent skip.

on:
  schedule:
    # Avalonia ships more often than SkiaSharp but still in weeks, not hours, so daily polling
    # costs one ~15 second job and bounds the delay at 24 hours. Note GitHub disables cron on
    # repos idle for 60 days.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would happen without starting a build
        required: false
        default: false
        type: boolean

concurrency:
  group: avalonia-watch
  cancel-in-progress: false

jobs:
  check:
    name: 🔭 Check for a new Avalonia
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      avalonia_version: ${{ steps.check.outputs.avalonia_version }}
      skiasharp_version: ${{ steps.check.outputs.skiasharp_version }}
      build_rev: ${{ steps.check.outputs.build_rev }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: 🔭 Compare upstream against what we shipped
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          # One place the marker naming lives, since the record job below has to match it.
          MARKER_PREFIX = "validated-avalonia-"

          def http_json(url, token=""):
              request = urllib.request.Request(url)
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
                  request.add_header("Accept", "application/vnd.github+json")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def versions(package_id):
              url = f"https://api.nuget.org/v3-flatcontainer/{package_id.lower()}/index.json"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return json.load(response).get("versions", [])
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return []
                  sys.exit(f"::error::nuget.org returned HTTP {error.code} for {package_id}.")
              except Exception as error:  # noqa: BLE001
                  sys.exit(f"::error::Could not reach nuget.org for {package_id}: {error}")

          # The flat container lists versions in ascending SemVer order.
          stable = [version for version in versions("Avalonia") if "-" not in version]
          if not stable:
              sys.exit("::error::nuget.org returned no stable Avalonia versions.")

          # The newest MAJOR, not merely the newest version. Avalonia maintains several majors
          # at once, and a patch to an older line is not what these packages track.
          newest_major = max(int(version.split(".")[0]) for version in stable)
          avalonia = [v for v in stable if int(v.split(".")[0]) == newest_major][-1]

          # Whatever that Avalonia depends on is what has to be compiled. Read, never assumed:
          # the two being chosen independently is the defect this watch was rewritten to prevent.
          nuspec_url = f"https://api.nuget.org/v3-flatcontainer/avalonia.skia/{avalonia}/avalonia.skia.nuspec"
          try:
              with urllib.request.urlopen(nuspec_url, timeout=30) as response:
                  nuspec = response.read().decode("utf-8")
          except Exception as error:  # noqa: BLE001
              sys.exit(f"::error::Could not read {nuspec_url}: {error}")
          found = re.search(r'id="SkiaSharp"\s+version="([^"]+)"', nuspec)
          if not found:
              sys.exit(
                  f"::error::Avalonia.Skia {avalonia} declares no SkiaSharp dependency. Refusing to "
                  "guess one - that guess is precisely what this watch exists to avoid."
              )
          skiasharp = found.group(1)

          # The trigger is a new AVALONIA, not a new SkiaSharp. Most Avalonia patches keep the same
          # SkiaSharp, so keying on SkiaSharp would skip them - and we would then be claiming
          # compatibility with an Avalonia release no run had ever rendered a frame against. The
          # payload really is unchanged in that case, but what changed is how Avalonia CALLS it,
          # which is exactly what a smoke test is for.
          #
          # "Did we validate THIS Avalonia" is recorded in the NAME of an artifact written by the
          # last successful validation, so nothing has to be downloaded and no repo state is
          # involved - a marker file can be edited or reverted, which is why the original watch
          # refused one.
          #
          # Asked as an exact-name query rather than by paging the repository artifact list. That
          # list is capped and ordered by creation, so a scan would depend on the marker still
          # sitting inside the newest N - true today only because nothing uploads after the record
          # job. Add artifacts to a run and the marker slides out of the window, which reads as
          # "not validated" and rebuilds nightly for ever. A filtered query has no window.
          #
          # An expired, missing or unreadable marker reads as "not validated" and we build. Erring
          # towards a redundant build rather than a silent skip is the whole point.
          marker = f"{MARKER_PREFIX}{avalonia}"
          validated = False
          try:
              listing = http_json(
                  "https://api.github.com/repos/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/artifacts"
                  f"?name={urllib.parse.quote(marker)}&per_page=100",
                  token=os.environ.get("GITHUB_TOKEN", ""),
              )
              validated = any(
                  not artifact.get("expired") for artifact in listing.get("artifacts", [])
              )
          except Exception as error:  # noqa: BLE001
              # A read failure must not be mistaken for "already validated".
              print(f"::warning::Could not read the validation marker ({error}); assuming none.")

          # The revision only matters when a build actually produces a new package, and this watch
          # never publishes. Keep it derived from what is on nuget.org so the summary suggests a
          # sane next version.
          shipped = versions("Optris.StaticGraphics.Avalonia.Vulkan")
          matching = [version for version in shipped if version.startswith(f"{skiasharp}.")]
          revisions = []
          for version in matching:
              parts = version.split(".")
              if len(parts) == 4 and parts[3].isdigit():
                  revisions.append(int(parts[3]))
          build_rev = (max(revisions) + 1) if revisions else 1

          should_build = not validated

          outputs = {
              "avalonia_version": avalonia,
              "skiasharp_version": skiasharp,
              "build_rev": str(build_rev),
              "should_build": str(should_build).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"Latest stable Avalonia major: **{avalonia}**, which depends on SkiaSharp "
                  f"**{skiasharp}**.\n\n"
              )
              if not should_build:
                  handle.write(
                      f"Avalonia **{avalonia}** was already validated, and nothing upstream has "
                      "moved since. Nothing to do.\n"
                  )
              else:
                  handle.write(
                      f"No `{marker}` marker, so Avalonia **{avalonia}** has never passed a "
                      f"validation build. Starting one against SkiaSharp **{skiasharp}**.\n\n"
                      "To release it: set `BuildRev` to "
                      f"`{build_rev}` in the packaging project and review "
                      "`OptrisStaticGraphicsAngleBranch`, which usually moves with a new Skia, then "
                      f"tag `v{skiasharp}.{build_rev}`. `SkiaSharpVersion` needs no edit - preflight "
                      "derives it from Avalonia.\n"
                  )
          PY

  build:
    name: 🧪 Validation build
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' && inputs.dry_run != true }}
    # Calling the release workflow instead of dispatching it keeps everything in one run and
    # sidesteps the question of whether GITHUB_TOKEN may start another workflow.
    # A called workflow can never hold more permission than its caller, so grant what the
    # release job declares even though this run never reaches it.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      # The Avalonia line is passed, not the SkiaSharp version: preflight derives that, and
      # passing both would reintroduce the two-sources-of-truth problem in the one workflow
      # written to remove it.
      avalonia_version: ${{ needs.check.outputs.avalonia_version }}
      build_rev: ${{ needs.check.outputs.build_rev }}
      publish_to_nuget: false
      publish_to_release: false
      allow_republish: false
    secrets: inherit

  record:
    name: 🔖 Record what was validated
    needs: [check, build]
    # Only a genuinely green validation counts. A failed or cancelled build must leave the marker
    # untouched, so the next run tries again rather than inheriting a pass it never earned.
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 🔖 Write the marker
        shell: bash
        env:
          AVALONIA_VERSION: ${{ needs.check.outputs.avalonia_version }}
        run: |
          set -euo pipefail
          mkdir -p marker
          # The NAME carries the version; the content is only here because an artifact needs a
          # file. That is deliberate - the next run reads the name from the artifacts API and
          # never downloads anything.
          {
            echo "Avalonia $AVALONIA_VERSION passed a full validation build."
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > marker/validated.txt

      - name: 📤 Upload the marker
        uses: actions/upload-artifact@v7
        with:
          name: validated-avalonia-${{ needs.check.outputs.avalonia_version }}
          path: marker/validated.txt
          if-no-files-found: error
          # Long enough that a quiet period upstream does not silently expire into a rebuild loop,
          # and short enough that the list the check job reads stays small.
          retention-days: 90
