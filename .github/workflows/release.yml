name: 📦 Release

# One run builds every tier of the fallback chain. Vulkan ⊃ OpenGL ⊃ Software, so a consumer
# can pick a smaller package without punching a hole in Avalonia's backend fallback.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tiers:
        description: JSON array of tiers to build
        required: false
        default: '["Vulkan","OpenGL","Software"]'
        type: string
      skiasharp_version:
        description: Override the SkiaSharp version pinned by the packaging project
        required: false
        default: ""
        type: string
      build_rev:
        description: Override the fork build revision pinned by the packaging project
        required: false
        default: ""
        type: string
      avalonia_version:
        description: Avalonia version for the AvaloniaNative package; empty uses latest stable
        required: false
        default: ""
        type: string
      publish_to_nuget:
        description: Push to nuget.org after the smoke tests
        required: false
        default: false
        type: boolean
      publish_to_release:
        description: Attach packages and smoke apps to a GitHub Release
        required: false
        default: true
        type: boolean
      allow_republish:
        description: Continue even when the resolved version is already on nuget.org
        required: false
        default: false
        type: boolean
      include_macos:
        description: Build and ship the osx RIDs
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      tiers:
        required: false
        default: '["Vulkan","OpenGL","Software"]'
        type: string
      skiasharp_version:
        required: false
        default: ""
        type: string
      build_rev:
        required: false
        default: ""
        type: string
      avalonia_version:
        required: false
        default: ""
        type: string
      publish_to_nuget:
        required: false
        default: false
        type: boolean
      publish_to_release:
        required: false
        default: false
        type: boolean
      allow_republish:
        required: false
        default: false
        type: boolean
      include_macos:
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.302"
  DOTNET_ALPINE_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.302-alpine3.23
  AVALONIA_SMOKE_VERSION: "11.3.14"

jobs:
  preflight:
    uses: ./.github/workflows/static-graphics-preflight.yml
    with:
      tiers: ${{ inputs.tiers || '["Vulkan","OpenGL","Software"]' }}
      skiasharp_version: ${{ inputs.skiasharp_version || '' }}
      build_rev: ${{ inputs.build_rev || '' }}
      allow_republish: ${{ inputs.allow_republish || false }}

  avalonia:
    name: 🔢 Resolve Avalonia version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      avalonia_version: ${{ steps.resolve.outputs.avalonia_version }}
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - name: 🔢 Resolve
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.avalonia_version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(curl --fail --silent --show-error --location \
              https://api.nuget.org/v3-flatcontainer/avalonia/index.json \
              | jq -r '[.versions[] | select(contains("-") | not)] | last')"
          fi
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not determine the latest stable Avalonia version."
            exit 1
          fi
          # A half-answered query must never become a version number. This used to collapse any
          # transport error, 404 or jq failure into revision=1 - the assertion "nothing of this
          # Avalonia version is published yet" - and when that was wrong, `dotnet nuget push
          # --skip-duplicate` exited 0 without publishing while the release notes advertised the
          # version as shipped. A green run, and consumers get the older bits. Preflight refuses
          # this exact assumption on principle for the tier packages; AvaloniaNative was the one
          # nobody guarded. 404 is the single case where 1 is a fact rather than a guess: the id
          # has never been published at all.
          index="$(mktemp)"
          status="$(curl --silent --location --output "$index" --write-out '%{http_code}' \
            https://api.nuget.org/v3-flatcontainer/optris.staticgraphics.avalonianative/index.json || echo 000)"
          case "$status" in
            200)
              revision="$(jq -r --arg v "$version" '[.versions[]? | select(startswith($v + ".")) | split(".")[3] | tonumber] | (max // 0) + 1' <"$index")" || {
                echo "::error::nuget.org returned an AvaloniaNative index that could not be parsed. Refusing to guess a revision."
                exit 1
              }
              ;;
            404) revision=1 ;;
            *)
              echo "::error::Could not read published AvaloniaNative versions from nuget.org (HTTP $status). Refusing to guess a revision - assuming 'not published' is how a run silently republishes an older build."
              exit 1
              ;;
          esac
          if [ -z "$revision" ] || [ "$revision" = "null" ]; then
            echo "::error::Computed an empty AvaloniaNative revision from the nuget.org index."
            exit 1
          fi
          echo "avalonia_version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$version.$revision" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: preflight
    uses: ./.github/workflows/static-graphics-windows.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      angle_branch: ${{ needs.preflight.outputs.angle_branch }}
      tiers: ${{ needs.preflight.outputs.tiers }}

  build-linux:
    needs: preflight
    uses: ./.github/workflows/static-graphics-linux.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      tiers: ${{ needs.preflight.outputs.tiers }}

  build-musl:
    needs: preflight
    uses: ./.github/workflows/static-graphics-musl.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      tiers: ${{ needs.preflight.outputs.tiers }}
      dotnet_alpine_image: mcr.microsoft.com/dotnet/sdk:10.0.302-alpine3.23

  build-macos:
    needs: preflight
    # macOS was opt-in because the symbol reader "reported every backend missing from an archive
    # that had just compiled cleanly". That was never a macOS fault: symbol_defined piped grep -F
    # into grep -q, and under pipefail the closed-pipe status turned EVERY symbol into "not
    # defined". macOS just tripped it first, its nm output for those names being large enough to
    # lose the race that Linux's narrow filter kept winning. With that fixed, both osx RIDs verify
    # their tier contract cleanly, so macOS is back in the release path where it belongs.
    # The flag stays as an escape hatch - macOS runners are the scarcest and slowest here - but
    # it is now a choice about build time, not a gap in what we can verify.
    if: ${{ (inputs.include_macos || github.event_name == 'push') }}
    uses: ./.github/workflows/static-graphics-macos.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      tiers: ${{ needs.preflight.outputs.tiers }}

  build-avalonia-native:
    needs: avalonia
    uses: ./.github/workflows/avalonia-native-build.yml
    with:
      avalonia_version: ${{ needs.avalonia.outputs.avalonia_version }}

  pack:
    name: 📦 Pack ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - preflight
      - build-windows
      - build-linux
      - build-musl
      - build-macos
    # A skipped `needs` skips its dependents by default, and build-macos is skipped whenever
    # include_macos is off - which is the normal case. This runs unless something actually failed.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.preflight.outputs.tiers) }}
    env:
      TIER: ${{ matrix.tier }}
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
      SKIASHARP_VERSION: ${{ needs.preflight.outputs.skiasharp_version }}
      BUILD_REV: ${{ needs.preflight.outputs.build_rev }}
      ANGLE_BRANCH: ${{ needs.preflight.outputs.angle_branch }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download static archives
        uses: actions/download-artifact@v7
        with:
          pattern: native-static-${{ matrix.tier }}-*
          path: External/NativeStatic/static-${{ matrix.tier }}

      - name: 📥 Download shared ANGLE archives
        # Software links no GL at all, so it never receives the shared ANGLE build.
        if: ${{ matrix.tier != 'Software' }}
        uses: actions/download-artifact@v7
        with:
          pattern: angle-static-*
          path: artifacts/angle

      - name: 🧩 Assemble tier payload
        shell: bash
        run: |
          set -euo pipefail
          root="External/NativeStatic/static-$TIER"
          for dir in "$root"/native-static-"$TIER"-*; do
            rid="${dir##*/native-static-$TIER-}"
            rm -rf "$root/$rid"
            mv "$dir" "$root/$rid"
          done

          if [ "$TIER" != "Software" ]; then
            for rid in win-x64 win-x86 win-arm64; do
              install -d "$root/$rid/native"
              # Only the archives. angle-branch.txt rides along in the artifact as evidence for the
              # package check below and must not end up inside the nupkg, where the payload
              # verifier's strict per-RID listing would rightly object to it.
              cp artifacts/angle/angle-static-"$rid"/*.lib "$root/$rid/native/"
            done
          fi

          find "$root" -type f | sort

      - name: ✅ Verify tier payload
        uses: ./.github/actions/verify-tier-payload
        with:
          tier: ${{ matrix.tier }}
          include_macos: ${{ (inputs.include_macos || github.event_name == 'push') }}

      - name: 📦 Pack
        shell: bash
        run: |
          set -euo pipefail
          projects=(NuGet/StaticGraphics/*.csproj)
          [ "${#projects[@]}" -eq 1 ] || { echo "::error::Expected one packaging project, found ${projects[*]}"; exit 1; }
          dotnet pack "${projects[0]}" -c Release -o artifacts/nuget \
            -p:Tier="$TIER" \
            -p:SkiaSharpVersion="$SKIASHARP_VERSION" \
            -p:BuildRev="$BUILD_REV" \
            -p:Version="$PACKAGE_VERSION" \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: ✅ Verify package contract
        uses: ./.github/actions/verify-tier-package
        with:
          tier: ${{ matrix.tier }}
          package: artifacts/nuget/Optris.StaticGraphics.Avalonia.${{ matrix.tier }}.${{ needs.preflight.outputs.package_version }}.nupkg
          angle_branch: ${{ needs.preflight.outputs.angle_branch }}
          # Written by the ANGLE build itself, from the checkout it actually made. Without it the
          # branch check compares the generated props against the property that generated them and
          # cannot fail. The Software tier ships no ANGLE and so has no record to point at.
          angle_branch_evidence: ${{ matrix.tier != 'Software' && 'artifacts/angle/angle-static-win-x64/angle-branch.txt' || '' }}
          # Must track the payload verifier above. Without it this asks a package built without
          # macOS for its osx archives and fails every tier at the last step - which is exactly
          # what happened once the builds themselves finally went green.
          include_macos: ${{ (inputs.include_macos || github.event_name == 'push') }}

      - name: 📤 Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ matrix.tier }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  pack-avalonia-native:
    name: 📦 Pack AvaloniaNative
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - avalonia
      - build-avalonia-native
    env:
      PACKAGE_VERSION: ${{ needs.avalonia.outputs.package_version }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download static AvaloniaNative archives
        uses: actions/download-artifact@v7
        with:
          pattern: native-avalonia-*
          path: artifacts/native

      - name: 🧩 Prepare package inputs
        shell: bash
        run: |
          set -euo pipefail
          for rid in osx-x64 osx-arm64; do
            install -d "External/AvaloniaNative/$rid/native"
            cp "artifacts/native/native-avalonia-$rid/libAvaloniaNative.a" "External/AvaloniaNative/$rid/native/"
            cp "artifacts/native/native-avalonia-$rid/macos_font_preinit.o" "External/AvaloniaNative/$rid/native/"
          done

      - name: 📦 Pack
        shell: bash
        run: |
          set -euo pipefail
          projects=(NuGet/AvaloniaNative/*.csproj)
          [ "${#projects[@]}" -eq 1 ] || { echo "::error::Expected one AvaloniaNative project, found ${projects[*]}"; exit 1; }
          dotnet pack "${projects[0]}" -c Release -o artifacts/nuget \
            -p:Version="$PACKAGE_VERSION" \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: ✅ Verify package
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/nuget/Optris.StaticGraphics.AvaloniaNative.$PACKAGE_VERSION.nupkg"
          test -f "$package"
          if unzip -Z1 "$package" | grep -F '\'; then
            echo "::error::Package contains Windows-only backslash paths."
            exit 1
          fi
          # grep -E "osx-(x64|arm64)/..." succeeds on the FIRST matching line, so a package
          # holding only one architecture passed a check that reads as "both are present". And
          # macos_font_preinit.o was never asserted at all - the object whose absence shows up as
          # text that never paints rather than as any kind of error. Every entry is named
          # individually now, and the message says which one is missing.
          entries="$(unzip -Z1 "$package")"
          missing=""
          for want in \
            "static/osx-x64/native/libAvaloniaNative.a" \
            "static/osx-arm64/native/libAvaloniaNative.a" \
            "static/osx-x64/native/macos_font_preinit.o" \
            "static/osx-arm64/native/macos_font_preinit.o"
          do
            printf '%s\n' "$entries" | grep -qxF "$want" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::error::AvaloniaNative package is missing:$missing"
            printf '%s\n' "$entries"
            exit 1
          fi

      - name: 📤 Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-avalonia-native
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  verify-consumer-guard:
    name: 🛡️ Consumer guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - preflight
      - pack
    # Same reason as pack's, and it has to be repeated here: the skip from build-macos propagates
    # down the whole chain, not just one level, so pack overriding it does not rescue pack's own
    # dependents. Without this the guard silently does not run on any include_macos=false build.
    if: ${{ !failure() && !cancelled() }}
    env:
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
      TIERS: ${{ needs.preflight.outputs.tiers }}
    steps:
      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      - name: 🛡️ Assert OSG0001 fires on a missing backend
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          version = os.environ["PACKAGE_VERSION"]
          tiers = json.loads(os.environ["TIERS"])
          backends = {"Vulkan": ["Vulkan", "OpenGL", "Software"], "OpenGL": ["OpenGL", "Software"], "Software": ["Software"]}
          feed = pathlib.Path("artifacts/nuget").resolve()
          failures = []

          def build(tier, required, acknowledge):
              directory = pathlib.Path(f"probe/{tier}-{'-'.join(required) or 'none'}")
              directory.mkdir(parents=True, exist_ok=True)
              (directory / "NuGet.config").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  "<configuration><packageSources><clear />"
                  f'<add key="local" value="{feed.as_posix()}" />'
                  '<add key="nuget" value="https://api.nuget.org/v3/index.json" />'
                  "</packageSources></configuration>\n",
                  encoding="utf-8",
              )
              (directory / "Probe.csproj").write_text(
                  "<Project Sdk=\"Microsoft.NET.Sdk\">\n"
                  "  <PropertyGroup>\n"
                  "    <TargetFramework>net10.0</TargetFramework>\n"
                  "    <OutputType>Exe</OutputType>\n"
                  "    <RuntimeIdentifier>linux-x64</RuntimeIdentifier>\n"
                  f"    <OptrisStaticGraphicsRequiredBackends>{';'.join(required)}</OptrisStaticGraphicsRequiredBackends>\n"
                  + (f"    <OptrisStaticGraphicsAcknowledgeReducedTier>true</OptrisStaticGraphicsAcknowledgeReducedTier>\n" if acknowledge else "")
                  + "  </PropertyGroup>\n"
                  "  <ItemGroup>\n"
                  f"    <PackageReference Include=\"Optris.StaticGraphics.Avalonia.{tier}\" Version=\"{version}\" />\n"
                  "  </ItemGroup>\n"
                  "</Project>\n",
                  encoding="utf-8",
              )
              (directory / "Program.cs").write_text("System.Console.WriteLine();\n", encoding="utf-8")
              result = subprocess.run(
                  ["dotnet", "build", str(directory / "Probe.csproj"), "-c", "Release"],
                  capture_output=True, text=True,
              )
              return result.returncode, result.stdout + result.stderr

          # Counted, because the two checks below are the only ones here that can fail when the
          # guard is broken - the positive probe builds fine whether or not OSG0001 still exists.
          # Both sit under `if missing:`, which is EMPTY for the Vulkan tier, since that tier
          # carries every backend. So a Vulkan-only run printed "Consumer guard behaves as
          # specified" having never once watched OSG0001 fire or OSG0002 warn, and the publish
          # gate then read that as proof the guard works.
          negative_controls = 0

          for tier in tiers:
              code, log = build(tier, backends[tier], acknowledge=True)
              if code != 0:
                  failures.append(f"{tier}: a project requiring exactly {backends[tier]} failed to build:\n{log[-4000:]}")
              missing = [name for name in ("Vulkan", "OpenGL") if name not in backends[tier]]
              if missing:
                  negative_controls += 1
                  code, log = build(tier, [missing[0]], acknowledge=True)
                  if code == 0:
                      failures.append(f"{tier}: requiring {missing[0]} built successfully; OSG0001 never fired")
                  elif "OSG0001" not in log:
                      failures.append(f"{tier}: requiring {missing[0]} failed without OSG0001:\n{log[-4000:]}")
                  code, log = build(tier, [], acknowledge=False)
                  if "OSG0002" not in log:
                      failures.append(f"{tier}: reduced tier used without acknowledgement did not warn OSG0002")

          if negative_controls == 0:
              failures.append(
                  f"no negative control ran. Every tier in {tiers} carries all backends, so neither "
                  "OSG0001 (requiring an absent backend must FAIL the build) nor OSG0002 (an "
                  "unacknowledged reduced tier must WARN) was ever exercised, and a regression in "
                  "either would have passed unseen. Include a reduced tier - OpenGL or Software - "
                  "in this run, or this job cannot claim the guard works."
              )

          if failures:
              sys.exit("::error::" + "\n\n".join(failures))
          print(
              f"Consumer guard behaves as specified: {negative_controls} negative control(s) "
              f"observed across tiers {tiers}."
          )
          PY

  smoke:
    name: 🔥 Smoke ${{ matrix.tier }} ${{ matrix.rid }}
    needs:
      - preflight
      - pack
    # As above. This one matters most: smoke is the only step that renders an actual frame, and
    # this repository exists because a package can pass every structural check and still draw
    # nothing. A run that skips it and reports success is the precise failure being guarded
    # against - which is what happened on the first run where everything else went green.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.preflight.outputs.tiers) }}
        # rid and include are BOTH switched together, and there is no `exclude` here on purpose.
        # GitHub processes include AFTER exclude and documents it as a way to add back combinations
        # exclude removed - so an excluded rid that still appears in include comes straight back,
        # and because include supplies no `tier` it returns as a tier-less combination. That is not
        # hypothetical: excluding the osx rids produced two extra jobs named "Smoke  osx-arm64",
        # with the empty tier visible in the double space, which then failed on an unknown tier.
        # Switching both lists leaves nothing for include to resurrect.
        # (A job-level `if` is still not an option: the matrix context does not exist there, so the
        # condition silently evaluates true and the job runs regardless.)
        rid: ${{ fromJSON((inputs.include_macos || github.event_name == 'push') && '["win-x64","win-x86","win-arm64","linux-x64","linux-arm64","linux-musl-x64","linux-musl-arm64","osx-x64","osx-arm64"]' || '["win-x64","win-x86","win-arm64","linux-x64","linux-arm64","linux-musl-x64","linux-musl-arm64"]') }}
        include: ${{ fromJSON((inputs.include_macos || github.event_name == 'push') && '[{"rid":"win-x64","runner":"windows-2022","msvc_arch":"x64"},{"rid":"win-x86","runner":"windows-2022","msvc_arch":"x86"},{"rid":"win-arm64","runner":"windows-11-arm","msvc_arch":"arm64"},{"rid":"linux-x64","runner":"ubuntu-24.04"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"linux-musl-x64","runner":"ubuntu-24.04"},{"rid":"linux-musl-arm64","runner":"ubuntu-24.04-arm"},{"rid":"osx-x64","runner":"macos-15"},{"rid":"osx-arm64","runner":"macos-15"}]' || '[{"rid":"win-x64","runner":"windows-2022","msvc_arch":"x64"},{"rid":"win-x86","runner":"windows-2022","msvc_arch":"x86"},{"rid":"win-arm64","runner":"windows-11-arm","msvc_arch":"arm64"},{"rid":"linux-x64","runner":"ubuntu-24.04"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"linux-musl-x64","runner":"ubuntu-24.04"},{"rid":"linux-musl-arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TIER: ${{ matrix.tier }}
      RID: ${{ matrix.rid }}
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🧰 Setup MSVC environment
        if: ${{ startsWith(matrix.rid, 'win-') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: 🧰 Install Linux publish and run dependencies
        if: ${{ startsWith(matrix.rid, 'linux-') && !startsWith(matrix.rid, 'linux-musl-') }}
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers is lavapipe, a software Vulkan ICD. The runner has no GPU and the
          # failure under test does not need one: Avalonia hands Skia a real VkDevice either way, and
          # a Skia built without Vulkan still answers with a null GRContext.
          sudo apt-get install -y clang lld xvfb zlib1g-dev libfontconfig1-dev libfreetype6 fonts-dejavu-core \
            libgl1 libgl1-mesa-dri libegl1 libgles2 libvulkan1 mesa-vulkan-drivers \
            libice6 libsm6 libx11-6 libxcb1 libxcursor1 libxext6 libxfixes3 libxinerama1 libxrandr2 libxrender1 libxi6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      - name: 🧭 What this tier has to be proven with
        shell: bash
        run: |
          set -euo pipefail
          # Each tier is a strict superset of the one below it, so a tier is only proven once every
          # backend it promises has drawn the picture. Asking for a backend a tier does not carry is
          # exit 3 from the app rather than a failure, so the list is derived and never guessed.
          case "$TIER" in
            Vulkan)   backends="Vulkan OpenGL Software" ;;
            OpenGL)   backends="OpenGL Software" ;;
            Software) backends="Software" ;;
            *) echo "::error::Unknown tier '$TIER'."; exit 1 ;;
          esac

          # On macOS the top tier is spelled Vulkan and delivered by Metal: Vulkan only reaches Apple
          # hardware through MoltenVK, which Skia does not vendor, so build-macos-static-graphics.sh
          # sets skia_use_metal and the payload verifier asserts GrMtlGpu. Metal is therefore
          # osx proves SOFTWARE ONLY here, and both omissions are recorded rather than quietly
          # arranged. Neither is a defect in the payload; both are things this runner cannot host.
          #
          # Vulkan is dropped instead of being substituted with Metal, which is what this tier
          # actually is on macOS. Avalonia reaches Metal by resolving
          # gr_direct_context_make_metal_with_options and gr_backendrendertarget_new_metal BY NAME
          # out of a dynamically loaded libSkiaSharp - SkiaSharp exposes no managed Metal GRContext
          # API - and a statically linked build has no such library, because this package deletes
          # it and a step below asserts it is gone. SkiaMetalApi throws DllNotFoundException before
          # Metal is ever reached. Measured on an M4 Pro: exit 134. Substituting Metal would only
          # turn these legs red without making anything work.
          #
          # OpenGL is dropped because these runners are virtualised and cannot hand Avalonia a GL
          # context: Skia returns a null GRContext and the app silently degrades to Software, which
          # is precisely the shape this pipeline refuses to accept as a pass. It is NOT broken in
          # the package - on real Apple hardware in a GUI session the same binary renders it, with
          # "Skia has a GPU context: GRContext backend OpenGL" and every pixel assertion green,
          # against renderer 'Apple M4 Pro'. CI cannot reproduce that, so it does not pretend to.
          #
          # Both are written up in README.md under "Known gap: Metal on macOS", with the
          # measurements and the reproduction. win-arm64 drops Vulkan for a simpler and unrelated
          # reason: lavapipe publishes no arm64 Windows build, so there is no software ICD there.
          case "$RID" in
            osx-*)     backends="$(printf '%s\n' $backends | grep -vxE 'Vulkan|OpenGL' | tr '\n' ' ' || true)" ;;
            win-arm64) backends="$(printf '%s\n' $backends | grep -vx Vulkan | tr '\n' ' ' || true)" ;;
          esac

          # GLX needs an X server that offers the extension AND a GL implementation behind it.
          # A bare `xvfb-run -a` gave neither reliably: every Linux OpenGL leg failed with
          # "X11PlatformOptions.RenderingMode has a value of Glx, but no options were applied",
          # which is Avalonia reporting that the mode could not be initialised at all. The runner
          # has no GPU, so the only GL available is Mesa's software rasteriser, and it has to be
          # asked for explicitly - llvmpipe is not what an unconfigured libGL picks.
          launcher=""
          case "$RID" in
            # Just "xvfb-run -a", and no --server-args: SMOKE_LAUNCHER is word-split where it is
            # used, so an argument containing spaces comes apart - "--server-args=-screen" became
            # one argument and "0" became a command, and xvfb-run died with "184: 0: not found",
            # breaking even the Software legs that had been passing.
            # Nothing is lost by dropping it. Debian's xvfb-run already defaults to
            # "-screen 0 1280x1024x24" and its Xvfb enables GLX; what the OpenGL legs were actually
            # missing is the software rasteriser selected by the environment below.
            linux-*) launcher="xvfb-run -a" ;;
          esac

          {
            echo "SMOKE_TIER=$TIER"
            echo "SMOKE_BACKENDS=$(echo $backends)"
            echo "SMOKE_LABEL=$TIER on $RID"
            echo "SMOKE_DIR=artifacts/smoke-$TIER-$RID"
            echo "SMOKE_LOG_DIR=artifacts/smoke-logs/$TIER-$RID"
            echo "SMOKE_LAUNCHER=$launcher"
          } >> "$GITHUB_ENV"

          # There used to be LIBGL_ALWAYS_SOFTWARE and GALLIUM_DRIVER exports here, on the theory
          # that the Linux OpenGL legs were failing for want of a software rasteriser. They were
          # not, and the variables changed nothing. Reproduced in a container: glxinfo already
          # reports llvmpipe with direct rendering and no such variables, and the OpenGL leg still
          # failed - because Avalonia's GLX backend cannot initialise under Xvfb at all. EGL can,
          # which is what the smoke app now asks for. Removed rather than left in place: config
          # kept "just in case" is how the next person inherits a wrong explanation.
          echo "$TIER on $RID will be proven with: $backends"

      - name: 🔥 Publish single-file smoke app
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectDir = Join-Path $PWD "artifacts/avalonia-smoke-src"
          pwsh ./scripts/create-avalonia-smoke.ps1 `
            -ProjectDir $projectDir `
            -NuGetSource (Resolve-Path "artifacts/nuget") `
            -Tier "$env:TIER" `
            -PackageVersion "$env:PACKAGE_VERSION" `
            -AvaloniaVersion "$env:AVALONIA_SMOKE_VERSION"
          dotnet publish (Join-Path $projectDir "OptrisStaticGraphicsSmoke.csproj") `
            -c Release `
            -r "$env:RID" `
            --configfile (Join-Path $projectDir "NuGet.config") `
            /p:PublishAot=true `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:StripSymbols=true `
            /p:PublishDir="$PWD/artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/"

      - name: 🔥 Publish musl smoke app
        if: ${{ startsWith(matrix.rid, 'linux-musl-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectDir = Join-Path $PWD "artifacts/avalonia-smoke-src"
          pwsh ./scripts/create-avalonia-smoke.ps1 `
            -ProjectDir $projectDir `
            -NuGetSource "/workspace/artifacts/nuget" `
            -Tier "$env:TIER" `
            -PackageVersion "$env:PACKAGE_VERSION" `
            -AvaloniaVersion "$env:AVALONIA_SMOKE_VERSION"
          docker run --rm `
            -v "${{ github.workspace }}:/workspace" `
            -w /workspace `
            "${{ env.DOTNET_ALPINE_IMAGE }}" `
            sh -c "apk add --no-cache clang lld build-base zlib-dev fontconfig-dev && dotnet publish /workspace/artifacts/avalonia-smoke-src/OptrisStaticGraphicsSmoke.csproj -c Release -r $env:RID --configfile /workspace/artifacts/avalonia-smoke-src/NuGet.config /p:PublishAot=true /p:SelfContained=true /p:PublishSingleFile=true /p:StripSymbols=true /p:PublishDir=/workspace/artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/"

      # Read this for what it is: the seven filenames scanned below are exactly the ones
      # OptrisStaticGraphicsCleanDynamicAssets deletes AfterTargets="Publish" whenever
      # _OptrisStaticGraphicsLink is true - and that condition is derived from the RID STRING, not
      # from whether any static archive was actually found and linked. So this step confirms the
      # delete ran. It cannot, on its own, tell a static link from a dynamic one that had its
      # libraries deleted out from under it.
      # What actually proves the link is static is the smoke run: a binary that expected to load
      # libSkiaSharp at runtime cannot render a frame once that file is gone, and the smoke step
      # renders and inspects pixels on every RID - win-arm64 included, since it now runs on a real
      # arm64 runner instead of being skipped. Keep this step for the cheap, early signal it gives
      # (an unexpected dynamic library sitting next to the app), and do not read more into a pass
      # than it can support.
      - name: ✅ Verify no dynamic graphics libraries remain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishDir = "artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}"
          $blocked = Get-ChildItem -Path $publishDir -Recurse -File | Where-Object {
            $_.Name -in @("libSkiaSharp.dll", "libHarfBuzzSharp.dll", "av_libglesv2.dll", "libSkiaSharp.so", "libHarfBuzzSharp.so", "libSkiaSharp.dylib", "libHarfBuzzSharp.dylib")
          }
          if ($blocked) {
            $blocked | ForEach-Object { Write-Error "Unexpected dynamic graphics library: $($_.FullName)" }
            exit 1
          }
          Get-ChildItem -Path $publishDir -Recurse -File | ForEach-Object { $_.FullName }

      - name: ✅ Verify Windows executable architecture
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/OptrisStaticGraphicsSmoke.exe"
          $expectedMachine = @{
            "win-x64" = "8664 machine"
            "win-x86" = "14C machine"
            "win-arm64" = "AA64 machine"
          }[$env:RID]
          $headers = & dumpbin /headers $app | Out-String
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch [regex]::Escape($expectedMachine)) {
            throw "Expected $expectedMachine in PE headers for $app.`n$headers"
          }

      # GitHub's Windows runners have no GPU and no Vulkan ICD, so without this the Vulkan tier
      # could not be smoke-tested at all on the platform we care most about - the build-time symbol
      # assertion would prove the backend is PRESENT while nothing proved it RENDERS. lavapipe is
      # Mesa's CPU Vulkan driver; it is enough for the defect under test, because a Skia built
      # without Vulkan hands back a null GRContext no matter who provides the device.
      #
      # Pinned to one release and verified against the SHA-256 GitHub publishes for that asset, so
      # this cannot silently become a different binary. It is used ONLY here: it never enters a
      # package, and this job has no id-token permission, so it cannot reach the publishing path.
      # Linux gets the same driver from apt (mesa-vulkan-drivers) and needs no download.
      # No arm64 build exists, which is why win-arm64 is excluded from the smoke step below.
      - name: 🌋 Install lavapipe (software Vulkan)
        if: ${{ startsWith(matrix.rid, 'win-') && matrix.rid != 'win-arm64' && matrix.tier == 'Vulkan' }}
        shell: pwsh
        env:
          MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.7/mesa3d-26.1.7-release-msvc.7z
          MESA_SHA256: c6e90c3117233b66f7816df05026a5fb0f88eaf7829bd07a1724b981487ec0bb
          VULKAN_SDK_VERSION: 1.4.357.0
          VULKAN_SDK_URL: https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkansdk-windows-X64-1.4.357.0.exe
          VULKAN_SDK_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:MESA_SHA256) {
            throw "lavapipe archive checksum mismatch. Expected $env:MESA_SHA256, got $actual. Refusing to run an unverified driver."
          }
          # x86 ships its own build; the ICD manifest names the dll beside it, so both files move together.
          $arch = if ($env:RID -eq "win-x86") { "x86" } else { "x64" }
          $icdName = if ($arch -eq "x86") { "lvp_icd.x86.json" } else { "lvp_icd.x86_64.json" }
          $dest = Join-Path $env:RUNNER_TEMP "lavapipe"
          & 7z x $archive "-o$dest" -y "$arch/vulkan_lvp.dll" "$arch/$icdName" | Out-Null
          $icd = Join-Path $dest "$arch/$icdName"
          if (-not (Test-Path $icd)) { throw "lavapipe ICD not found at $icd after extraction." }

          # An ICD is not reachable without a loader. vulkan-1.dll is what vkCreateInstance is
          # resolved from, and installing lavapipe alone leaves nothing to load it: the Vulkan
          # smoke failed with Avalonia's generic "RenderingMode has a value of Vulkan, but no
          # options were applied", which names the symptom and not the cause. Linux gets a loader
          # from libvulkan1 in the apt line; Windows normally gets one from a GPU driver, and a
          # GitHub runner has no GPU. Confirmed against the pinned mesa archive: it ships
          # vulkan_lvp.dll and vulkan_dzn.dll and their ICD manifests, and no loader at all.
          # So the loader comes from LunarG's SDK, pinned by version AND by hash for the same
          # reason the mesa archive is - this is a driver component reaching a machine that then
          # certifies what we publish.
          $systemLoader = Join-Path $env:SystemRoot "System32/vulkan-1.dll"
          if (Test-Path $systemLoader) {
            Write-Host "Vulkan loader: $systemLoader (already present)"
          } else {
            $sdk = Join-Path $env:RUNNER_TEMP "vulkansdk.exe"
            Invoke-WebRequest -Uri $env:VULKAN_SDK_URL -OutFile $sdk
            $sdkHash = (Get-FileHash $sdk -Algorithm SHA256).Hash.ToLower()
            if ($sdkHash -ne $env:VULKAN_SDK_SHA256) {
              throw "Vulkan SDK checksum mismatch. Expected $env:VULKAN_SDK_SHA256, got $sdkHash. Refusing to run an unverified installer."
            }
            $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK"
            # LunarG ships a Qt-installer; these are its documented unattended switches. 7z can
            # read the wrapper but not the payload, so there is no lighter extract-one-dll path.
            & $sdk --root $sdkRoot --accept-licenses --default-answer --confirm-command install | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "The Vulkan SDK installer exited $LASTEXITCODE."
            }
            # Bitness is decided by reading the PE header, not by the directory a file sits in.
            # The first attempt looked only in Bin (x64) and Bin32 (x86) - the historical SDK
            # layout - and threw "carries no Bin/vulkan-1.dll" on an SDK that had installed
            # perfectly well. Where the loader lives is the SDK's business and it has moved before;
            # what it IS can be read off the file. An x64 loader on the x86 leg would load happily
            # and then refuse every 32-bit ICD, which is why this cannot just take the first hit.
            $wantMachine = if ($arch -eq "x86") { 0x014C } else { 0x8664 }
            $found = $null
            foreach ($candidate in Get-ChildItem -Path $sdkRoot -Recurse -Filter "vulkan-1.dll" -ErrorAction SilentlyContinue) {
              try {
                $fs = [System.IO.File]::OpenRead($candidate.FullName)
                $br = New-Object System.IO.BinaryReader($fs)
                $fs.Position = 0x3C
                $peOffset = $br.ReadInt32()
                $fs.Position = $peOffset
                if ($br.ReadUInt32() -eq 0x00004550) {
                  $machine = $br.ReadUInt16()
                  if ($machine -eq $wantMachine) { $found = $candidate }
                }
              } catch {
              } finally {
                if ($br) { $br.Dispose() }
                if ($fs) { $fs.Dispose() }
              }
              if ($found) { break }
            }
            if (-not $found) {
              $seen = (Get-ChildItem -Path $sdkRoot -Recurse -Filter "vulkan-1.dll" -ErrorAction SilentlyContinue |
                       ForEach-Object { $_.FullName }) -join "; "
              throw ("The Vulkan SDK installed but carries no $arch vulkan-1.dll, so there is no " +
                     "loader for the lavapipe ICD and the Vulkan smoke cannot run on $env:RID. " +
                     "vulkan-1.dll copies found: " + $(if ($seen) { $seen } else { "none at all" }) +
                     ". Either supply a $arch loader another way, or drop Vulkan from the backends " +
                     "proven on this RID the way win-arm64 and osx-* already do - but do not leave " +
                     "a tier claiming a backend no run has ever exercised.")
            }
            Copy-Item $found.FullName (Join-Path $dest "$arch/vulkan-1.dll") -Force
            Write-Host "Vulkan loader: $($found.FullName) -> $dest/$arch (from LunarG SDK $env:VULKAN_SDK_VERSION)"
            # Beside the ICD, and first on PATH: the app must load THIS loader, not something a
            # later toolchain step drops on the machine.
            "$dest/$arch" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          # VK_DRIVER_FILES restricts the loader to exactly this ICD, so a passing Vulkan smoke here
          # is proof the software driver drew it rather than something else on the machine.
          "VK_DRIVER_FILES=$icd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "lavapipe ICD: $icd"

      # Windows, Linux and macOS all run the same script, so one check covers three platforms. The
      # app's exit code is the whole verdict: there is deliberately no "it was still running, so it
      # must be fine" branch, because a process that stays alive is precisely what the blank window
      # this repository exists to catch looks like. That branch is how the defect shipped upstream.
      - name: ▶️ Smoke the app, once per backend the tier promises
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: sh scripts/run-smoke.sh

      - name: 🧪 Prove the smoke test can fail
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        env:
          SMOKE_SELFTEST: "1"
        run: sh scripts/run-smoke.sh

      - name: ✅ Verify musl ELF dependencies
        if: ${{ startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e APP="artifacts/smoke-$TIER-$RID/OptrisStaticGraphicsSmoke" \
            alpine:3.23 \
            sh -c 'apk add --no-cache binutils pax-utils && readelf -l "$APP" | grep "Requesting program interpreter: /lib/ld-musl-" && scanelf -n "$APP" && ! scanelf -n "$APP" | grep -E "ld-linux|ld64.so"'

      # One container for both phases: the apk install costs far more than either run does, and a
      # negative control that is skipped whenever the real runs fail is not a control at all.
      - name: ▶️ Smoke the musl app per backend, then prove it can fail
        if: ${{ startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/smoke-logs/$TIER-$RID"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SMOKE_TIER \
            -e SMOKE_BACKENDS \
            -e SMOKE_LABEL \
            -e SMOKE_DIR="/workspace/artifacts/smoke-$TIER-$RID" \
            -e SMOKE_LOG_DIR="/workspace/artifacts/smoke-logs/$TIER-$RID" \
            -e SMOKE_LAUNCHER="xvfb-run -a" \
            alpine:3.23 \
            sh -c 'apk add --no-cache xvfb-run libstdc++ libgcc fontconfig freetype ttf-dejavu \
                     libx11 libxcb libxext libxrender libxi libxrandr libxcursor libxfixes libxinerama libice libsm \
                     mesa-gl mesa-egl mesa-dri-gallium mesa-vulkan-swrast vulkan-loader || exit 1
                   fc-cache -f || exit 1
                   fc-match sans || exit 1
                   status=0
                   sh /workspace/scripts/run-smoke.sh || status=1
                   SMOKE_SELFTEST=1 sh /workspace/scripts/run-smoke.sh || status=1
                   exit $status'

      # A blank frame is the evidence, so the frames and the reports go up whether the job passed or
      # failed - a red run without the picture it read back is just an assertion nobody can check.
      - name: 📤 Upload smoke frames and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-evidence-${{ matrix.tier }}-${{ matrix.rid }}
          path: artifacts/smoke-logs/${{ matrix.tier }}-${{ matrix.rid }}/**
          if-no-files-found: warn

      - name: 📤 Upload smoke app
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-smoke-${{ matrix.tier }}-${{ matrix.rid }}
          path: artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/**
          if-no-files-found: error

  publish-nuget:
    name: 🚀 Publish to nuget.org
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Trusted Publishing: nuget.org trusts a short-lived OIDC token from this exact repository and
    # workflow file instead of a stored key, so there is no long-lived credential to leak, rotate,
    # or replay out of a log. id-token: write is what lets the job ask GitHub for that token; the
    # policy on nuget.org is pinned to owner/repo IDs, so deleting and recreating a repo of the
    # same name cannot inherit the trust. Renaming THIS FILE breaks publishing until the policy's
    # "Workflow File" is updated to match.
    permissions:
      id-token: write
      contents: read
    needs:
      - pack
      - pack-avalonia-native
      - verify-consumer-guard
      - smoke
    # The gate is spelled out rather than left to GitHub's skip propagation, because publishing is
    # the one irreversible step here and the propagation rules are exactly what went wrong above:
    # smoke was skipped while the run still reported success. Naming each result makes "nothing
    # ships that has not rendered a frame" a property of this file rather than of a default.
    if: >-
      ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_nuget == true)
          && needs.pack.result == 'success'
          && needs['pack-avalonia-native'].result == 'success'
          && needs['verify-consumer-guard'].result == 'success'
          && needs.smoke.result == 'success' }}
    steps:
      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      # Immediately before the push, deliberately: the key nuget.org hands back is valid for one
      # hour, and one OIDC token buys exactly one key. Requesting it any earlier in the job just
      # spends part of that hour waiting.
      - name: 🔑 NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER || 'saitz-optris' }}

      - name: 🚀 Push
        working-directory: artifacts/nuget
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::The OIDC exchange returned no key. Check the Trusted Publishing policy on nuget.org matches owner Optris, repository Optris.StaticGraphics.Avalonia and workflow file release.yml, and that the login user is the nuget.org profile name."
            exit 1
          fi
          ls -la
          # Optris.StaticGraphics.AvaloniaNative is deliberately NOT pushed from here, and the
          # exclusion is the point rather than an oversight. This job's gate requires
          # needs.smoke.result == 'success', which reads as "everything published rendered a
          # frame" - but the smoke matrix structurally cannot cover that package. release.yml
          # calls create-avalonia-smoke.ps1 without -AvaloniaNativeVersion, and the smoke
          # project's PackageReference for it is conditioned on that value, so MSBuild drops it
          # without a word; no process built from it is ever launched here. Its characteristic
          # failure - an inert macos_font_preinit.o - is text that never paints, not an error, so
          # the zip-entry listing that pack-avalonia-native performs cannot see it either.
          # avalonia-native.yml links the package, asserts the static link actually happened,
          # smokes it per backend and then proves the smoke can fail. That is where it ships from.
          # NOTE this means nuget.org needs a Trusted Publishing policy naming avalonia-native.yml;
          # without one that workflow's push fails closed, which is the correct direction to fail.
          pushed=0
          skipped=""
          for package in *.nupkg; do
            case "$package" in
              Optris.StaticGraphics.AvaloniaNative.*)
                skipped="$skipped $package"
                continue
                ;;
            esac
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
            pushed=$((pushed + 1))
          done
          if [ -n "$skipped" ]; then
            echo "Not pushed from this workflow (published by avalonia-native.yml, which smokes it):$skipped"
          fi
          # A push loop that matched nothing would otherwise be indistinguishable from a
          # successful release.
          if [ "$pushed" -eq 0 ]; then
            echo "::error::No tier package was pushed. artifacts/nuget held no Optris.StaticGraphics.Avalonia.<tier> package, so this run published nothing while reporting success."
            exit 1
          fi
          if compgen -G "*.snupkg" > /dev/null; then
            for symbols in *.snupkg; do
              case "$symbols" in
                Optris.StaticGraphics.AvaloniaNative.*) continue ;;
              esac
              dotnet nuget push "$symbols" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
            done
          fi

  release:
    name: 🏷️ GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - preflight
      - avalonia
      - pack
      - pack-avalonia-native
      - verify-consumer-guard
      - smoke
    # Same reasoning as publish-nuget's: an attached release asset is public too.
    if: >-
      ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_release == true)
          && needs.pack.result == 'success'
          && needs['pack-avalonia-native'].result == 'success'
          && needs['verify-consumer-guard'].result == 'success'
          && needs.smoke.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: release-artifacts/nuget
          merge-multiple: true

      - name: 📥 Download smoke artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: avalonia-smoke-*
          path: release-artifacts/smoke

      - name: 🧩 Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release-artifacts/nuget -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -exec cp {} release-files/ \;
          for dir in release-artifacts/smoke/avalonia-smoke-*; do
            [ -d "$dir" ] || continue
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release-files/$(basename "$dir").zip" .)
          done
          ls -la release-files

      - name: 🏷️ Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
          NATIVE_VERSION: ${{ needs.avalonia.outputs.package_version }}
          TIERS: ${{ needs.preflight.outputs.tiers }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v${PACKAGE_VERSION}"
          fi
          notes="Tiers: ${TIERS}. Optris.StaticGraphics.Avalonia.<Tier> ${PACKAGE_VERSION}, Optris.StaticGraphics.AvaloniaNative ${NATIVE_VERSION}. Each tier is a strict superset of the next: Vulkan ⊃ OpenGL ⊃ Software."
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-files/* --clobber
          else
            gh release create "$release_tag" release-files/* \
              --target "$GITHUB_SHA" \
              --title "Optris.StaticGraphics.Avalonia ${PACKAGE_VERSION}" \
              --notes "$notes"
          fi
