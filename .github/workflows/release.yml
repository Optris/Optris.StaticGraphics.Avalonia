name: 📦 Release

# One run builds every tier of the fallback chain. Vulkan ⊃ OpenGL ⊃ Software, so a consumer
# can pick a smaller package without punching a hole in Avalonia's backend fallback.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tiers:
        description: JSON array of tiers to build
        required: false
        default: '["Vulkan","OpenGL","Software"]'
        type: string
      skiasharp_version:
        description: Override the SkiaSharp version pinned by the packaging project
        required: false
        default: ""
        type: string
      build_rev:
        description: Override the fork build revision pinned by the packaging project
        required: false
        default: ""
        type: string
      avalonia_version:
        description: Avalonia version for the AvaloniaNative package; empty uses latest stable
        required: false
        default: ""
        type: string
      publish_to_nuget:
        description: Push to nuget.org after the smoke tests
        required: false
        default: false
        type: boolean
      publish_to_release:
        description: Attach packages and smoke apps to a GitHub Release
        required: false
        default: true
        type: boolean
      allow_republish:
        description: Continue even when the resolved version is already on nuget.org
        required: false
        default: false
        type: boolean
      include_macos:
        description: Build and ship the osx RIDs (off - the macOS symbol reader is unreliable)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tiers:
        required: false
        default: '["Vulkan","OpenGL","Software"]'
        type: string
      skiasharp_version:
        required: false
        default: ""
        type: string
      build_rev:
        required: false
        default: ""
        type: string
      avalonia_version:
        required: false
        default: ""
        type: string
      publish_to_nuget:
        required: false
        default: false
        type: boolean
      publish_to_release:
        required: false
        default: false
        type: boolean
      allow_republish:
        required: false
        default: false
        type: boolean
      include_macos:
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.302"
  DOTNET_ALPINE_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.302-alpine3.23
  AVALONIA_SMOKE_VERSION: "11.3.14"

jobs:
  preflight:
    uses: ./.github/workflows/static-graphics-preflight.yml
    with:
      tiers: ${{ inputs.tiers || '["Vulkan","OpenGL","Software"]' }}
      skiasharp_version: ${{ inputs.skiasharp_version || '' }}
      build_rev: ${{ inputs.build_rev || '' }}
      allow_republish: ${{ inputs.allow_republish || false }}

  avalonia:
    name: 🔢 Resolve Avalonia version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      avalonia_version: ${{ steps.resolve.outputs.avalonia_version }}
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - name: 🔢 Resolve
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.avalonia_version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(curl --fail --silent --show-error --location \
              https://api.nuget.org/v3-flatcontainer/avalonia/index.json \
              | jq -r '[.versions[] | select(contains("-") | not)] | last')"
          fi
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not determine the latest stable Avalonia version."
            exit 1
          fi
          revision="$(curl --silent --location \
            https://api.nuget.org/v3-flatcontainer/optris.staticgraphics.avalonianative/index.json \
            | jq -r --arg v "$version" '[.versions[]? | select(startswith($v + ".")) | split(".")[3] | tonumber] | (max // 0) + 1' 2>/dev/null || echo 1)"
          [ -n "$revision" ] && [ "$revision" != "null" ] || revision=1
          echo "avalonia_version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$version.$revision" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: preflight
    uses: ./.github/workflows/static-graphics-windows.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      angle_branch: ${{ needs.preflight.outputs.angle_branch }}
      tiers: ${{ needs.preflight.outputs.tiers }}

  build-linux:
    needs: preflight
    uses: ./.github/workflows/static-graphics-linux.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      tiers: ${{ needs.preflight.outputs.tiers }}

  build-musl:
    needs: preflight
    uses: ./.github/workflows/static-graphics-musl.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      tiers: ${{ needs.preflight.outputs.tiers }}
      dotnet_alpine_image: mcr.microsoft.com/dotnet/sdk:10.0.302-alpine3.23

  build-macos:
    needs: preflight
    # Opt-in. The macOS symbol reader reports every backend missing from an archive that has just
    # compiled cleanly, so the tier contract cannot be verified there - and shipping a tier whose
    # contract was not checked is the exact thing this repository exists to refuse.
    if: ${{ inputs.include_macos }}
    uses: ./.github/workflows/static-graphics-macos.yml
    with:
      skiasharp_version: ${{ needs.preflight.outputs.skiasharp_version }}
      tiers: ${{ needs.preflight.outputs.tiers }}

  build-avalonia-native:
    needs: avalonia
    uses: ./.github/workflows/avalonia-native-build.yml
    with:
      avalonia_version: ${{ needs.avalonia.outputs.avalonia_version }}

  pack:
    name: 📦 Pack ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - preflight
      - build-windows
      - build-linux
      - build-musl
      - build-macos
    # A skipped `needs` skips its dependents by default, and build-macos is skipped whenever
    # include_macos is off - which is the normal case. This runs unless something actually failed.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.preflight.outputs.tiers) }}
    env:
      TIER: ${{ matrix.tier }}
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
      SKIASHARP_VERSION: ${{ needs.preflight.outputs.skiasharp_version }}
      BUILD_REV: ${{ needs.preflight.outputs.build_rev }}
      ANGLE_BRANCH: ${{ needs.preflight.outputs.angle_branch }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download static archives
        uses: actions/download-artifact@v7
        with:
          pattern: native-static-${{ matrix.tier }}-*
          path: External/NativeStatic/static-${{ matrix.tier }}

      - name: 📥 Download shared ANGLE archives
        # Software links no GL at all, so it never receives the shared ANGLE build.
        if: ${{ matrix.tier != 'Software' }}
        uses: actions/download-artifact@v7
        with:
          pattern: angle-static-*
          path: artifacts/angle

      - name: 🧩 Assemble tier payload
        shell: bash
        run: |
          set -euo pipefail
          root="External/NativeStatic/static-$TIER"
          for dir in "$root"/native-static-"$TIER"-*; do
            rid="${dir##*/native-static-$TIER-}"
            rm -rf "$root/$rid"
            mv "$dir" "$root/$rid"
          done

          if [ "$TIER" != "Software" ]; then
            for rid in win-x64 win-x86 win-arm64; do
              install -d "$root/$rid/native"
              cp artifacts/angle/angle-static-"$rid"/* "$root/$rid/native/"
            done
          fi

          find "$root" -type f | sort

      - name: ✅ Verify tier payload
        uses: ./.github/actions/verify-tier-payload
        with:
          tier: ${{ matrix.tier }}
          include_macos: ${{ inputs.include_macos }}

      - name: 📦 Pack
        shell: bash
        run: |
          set -euo pipefail
          projects=(NuGet/StaticGraphics/*.csproj)
          [ "${#projects[@]}" -eq 1 ] || { echo "::error::Expected one packaging project, found ${projects[*]}"; exit 1; }
          dotnet pack "${projects[0]}" -c Release -o artifacts/nuget \
            -p:Tier="$TIER" \
            -p:SkiaSharpVersion="$SKIASHARP_VERSION" \
            -p:BuildRev="$BUILD_REV" \
            -p:Version="$PACKAGE_VERSION" \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: ✅ Verify package contract
        uses: ./.github/actions/verify-tier-package
        with:
          tier: ${{ matrix.tier }}
          package: artifacts/nuget/Optris.StaticGraphics.Avalonia.${{ matrix.tier }}.${{ needs.preflight.outputs.package_version }}.nupkg
          angle_branch: ${{ needs.preflight.outputs.angle_branch }}

      - name: 📤 Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ matrix.tier }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  pack-avalonia-native:
    name: 📦 Pack AvaloniaNative
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - avalonia
      - build-avalonia-native
    env:
      PACKAGE_VERSION: ${{ needs.avalonia.outputs.package_version }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download static AvaloniaNative archives
        uses: actions/download-artifact@v7
        with:
          pattern: native-avalonia-*
          path: artifacts/native

      - name: 🧩 Prepare package inputs
        shell: bash
        run: |
          set -euo pipefail
          for rid in osx-x64 osx-arm64; do
            install -d "External/AvaloniaNative/$rid/native"
            cp "artifacts/native/native-avalonia-$rid/libAvaloniaNative.a" "External/AvaloniaNative/$rid/native/"
            cp "artifacts/native/native-avalonia-$rid/macos_font_preinit.o" "External/AvaloniaNative/$rid/native/"
          done

      - name: 📦 Pack
        shell: bash
        run: |
          set -euo pipefail
          projects=(NuGet/AvaloniaNative/*.csproj)
          [ "${#projects[@]}" -eq 1 ] || { echo "::error::Expected one AvaloniaNative project, found ${projects[*]}"; exit 1; }
          dotnet pack "${projects[0]}" -c Release -o artifacts/nuget \
            -p:Version="$PACKAGE_VERSION" \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: ✅ Verify package
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/nuget/Optris.StaticGraphics.AvaloniaNative.$PACKAGE_VERSION.nupkg"
          test -f "$package"
          if unzip -Z1 "$package" | grep -F '\'; then
            echo "::error::Package contains Windows-only backslash paths."
            exit 1
          fi
          unzip -Z1 "$package" | grep -E "osx-(x64|arm64)/native/libAvaloniaNative\.a"

      - name: 📤 Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-avalonia-native
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  verify-consumer-guard:
    name: 🛡️ Consumer guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - preflight
      - pack
    env:
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
      TIERS: ${{ needs.preflight.outputs.tiers }}
    steps:
      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      - name: 🛡️ Assert OSG0001 fires on a missing backend
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          version = os.environ["PACKAGE_VERSION"]
          tiers = json.loads(os.environ["TIERS"])
          backends = {"Vulkan": ["Vulkan", "OpenGL", "Software"], "OpenGL": ["OpenGL", "Software"], "Software": ["Software"]}
          feed = pathlib.Path("artifacts/nuget").resolve()
          failures = []

          def build(tier, required, acknowledge):
              directory = pathlib.Path(f"probe/{tier}-{'-'.join(required) or 'none'}")
              directory.mkdir(parents=True, exist_ok=True)
              (directory / "NuGet.config").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  "<configuration><packageSources><clear />"
                  f'<add key="local" value="{feed.as_posix()}" />'
                  '<add key="nuget" value="https://api.nuget.org/v3/index.json" />'
                  "</packageSources></configuration>\n",
                  encoding="utf-8",
              )
              (directory / "Probe.csproj").write_text(
                  "<Project Sdk=\"Microsoft.NET.Sdk\">\n"
                  "  <PropertyGroup>\n"
                  "    <TargetFramework>net10.0</TargetFramework>\n"
                  "    <OutputType>Exe</OutputType>\n"
                  "    <RuntimeIdentifier>linux-x64</RuntimeIdentifier>\n"
                  f"    <OptrisStaticGraphicsRequiredBackends>{';'.join(required)}</OptrisStaticGraphicsRequiredBackends>\n"
                  + (f"    <OptrisStaticGraphicsAcknowledgeReducedTier>true</OptrisStaticGraphicsAcknowledgeReducedTier>\n" if acknowledge else "")
                  + "  </PropertyGroup>\n"
                  "  <ItemGroup>\n"
                  f"    <PackageReference Include=\"Optris.StaticGraphics.Avalonia.{tier}\" Version=\"{version}\" />\n"
                  "  </ItemGroup>\n"
                  "</Project>\n",
                  encoding="utf-8",
              )
              (directory / "Program.cs").write_text("System.Console.WriteLine();\n", encoding="utf-8")
              result = subprocess.run(
                  ["dotnet", "build", str(directory / "Probe.csproj"), "-c", "Release"],
                  capture_output=True, text=True,
              )
              return result.returncode, result.stdout + result.stderr

          for tier in tiers:
              code, log = build(tier, backends[tier], acknowledge=True)
              if code != 0:
                  failures.append(f"{tier}: a project requiring exactly {backends[tier]} failed to build:\n{log[-4000:]}")
              missing = [name for name in ("Vulkan", "OpenGL") if name not in backends[tier]]
              if missing:
                  code, log = build(tier, [missing[0]], acknowledge=True)
                  if code == 0:
                      failures.append(f"{tier}: requiring {missing[0]} built successfully; OSG0001 never fired")
                  elif "OSG0001" not in log:
                      failures.append(f"{tier}: requiring {missing[0]} failed without OSG0001:\n{log[-4000:]}")
                  code, log = build(tier, [], acknowledge=False)
                  if "OSG0002" not in log:
                      failures.append(f"{tier}: reduced tier used without acknowledgement did not warn OSG0002")

          if failures:
              sys.exit("::error::" + "\n\n".join(failures))
          print("Consumer guard behaves as specified.")
          PY

  smoke:
    name: 🔥 Smoke ${{ matrix.tier }} ${{ matrix.rid }}
    needs:
      - preflight
      - pack
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.preflight.outputs.tiers) }}
        rid: [win-x64, win-x86, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64]
        # Dropped rather than gated with a job-level `if`: the matrix context is not available
        # there, so such a condition silently evaluates true and the job runs anyway. exclude is
        # evaluated with the inputs context, which is. The osx entries stay in the list above so
        # turning include_macos on needs no matrix surgery.
        # linux-musl-arm64 is dropped in static-graphics-musl.yml too - no payload is built for
        # it, so there is nothing to smoke.
        exclude: ${{ fromJSON(inputs.include_macos && '[{"rid":"linux-musl-arm64"}]' || '[{"rid":"osx-x64"},{"rid":"osx-arm64"},{"rid":"linux-musl-arm64"}]') }}
        include:
          - rid: win-x64
            runner: windows-2022
            msvc_arch: x64
          - rid: win-x86
            runner: windows-2022
            msvc_arch: x86
          - rid: win-arm64
            runner: windows-2022
            msvc_arch: amd64_arm64
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: linux-musl-x64
            runner: ubuntu-24.04
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TIER: ${{ matrix.tier }}
      RID: ${{ matrix.rid }}
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🧰 Setup MSVC environment
        if: ${{ startsWith(matrix.rid, 'win-') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: 🧰 Install Linux publish and run dependencies
        if: ${{ startsWith(matrix.rid, 'linux-') && !startsWith(matrix.rid, 'linux-musl-') }}
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers is lavapipe, a software Vulkan ICD. The runner has no GPU and the
          # failure under test does not need one: Avalonia hands Skia a real VkDevice either way, and
          # a Skia built without Vulkan still answers with a null GRContext.
          sudo apt-get install -y clang lld xvfb zlib1g-dev libfontconfig1-dev libfreetype6 fonts-dejavu-core \
            libgl1 libgl1-mesa-dri libegl1 libvulkan1 mesa-vulkan-drivers \
            libice6 libsm6 libx11-6 libxcb1 libxcursor1 libxext6 libxfixes3 libxinerama1 libxrandr2 libxrender1 libxi6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      - name: 🧭 What this tier has to be proven with
        shell: bash
        run: |
          set -euo pipefail
          # Each tier is a strict superset of the one below it, so a tier is only proven once every
          # backend it promises has drawn the picture. Asking for a backend a tier does not carry is
          # exit 3 from the app rather than a failure, so the list is derived and never guessed.
          case "$TIER" in
            Vulkan)   backends="Vulkan OpenGL Software" ;;
            OpenGL)   backends="OpenGL Software" ;;
            Software) backends="Software" ;;
            *) echo "::error::Unknown tier '$TIER'."; exit 1 ;;
          esac

          # Avalonia has no Vulkan backend on macOS, and the app refuses such a run with exit 3 rather
          # than accepting Metal in its place; a Vulkan tier is proven there by its other two backends.
          case "$RID" in
            osx-*) backends="$(printf '%s\n' $backends | grep -vx Vulkan | tr '\n' ' ' || true)" ;;
          esac

          launcher=""
          case "$RID" in
            linux-*) launcher="xvfb-run -a" ;;
          esac

          {
            echo "SMOKE_TIER=$TIER"
            echo "SMOKE_BACKENDS=$(echo $backends)"
            echo "SMOKE_LABEL=$TIER on $RID"
            echo "SMOKE_DIR=artifacts/smoke-$TIER-$RID"
            echo "SMOKE_LOG_DIR=artifacts/smoke-logs/$TIER-$RID"
            echo "SMOKE_LAUNCHER=$launcher"
          } >> "$GITHUB_ENV"
          echo "$TIER on $RID will be proven with: $backends"

      - name: 🔥 Publish single-file smoke app
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectDir = Join-Path $PWD "artifacts/avalonia-smoke-src"
          pwsh ./scripts/create-avalonia-smoke.ps1 `
            -ProjectDir $projectDir `
            -NuGetSource (Resolve-Path "artifacts/nuget") `
            -Tier "$env:TIER" `
            -PackageVersion "$env:PACKAGE_VERSION" `
            -AvaloniaVersion "$env:AVALONIA_SMOKE_VERSION"
          dotnet publish (Join-Path $projectDir "OptrisStaticGraphicsSmoke.csproj") `
            -c Release `
            -r "$env:RID" `
            --configfile (Join-Path $projectDir "NuGet.config") `
            /p:PublishAot=true `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:StripSymbols=true `
            /p:PublishDir="$PWD/artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/"

      - name: 🔥 Publish musl smoke app
        if: ${{ startsWith(matrix.rid, 'linux-musl-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectDir = Join-Path $PWD "artifacts/avalonia-smoke-src"
          pwsh ./scripts/create-avalonia-smoke.ps1 `
            -ProjectDir $projectDir `
            -NuGetSource "/workspace/artifacts/nuget" `
            -Tier "$env:TIER" `
            -PackageVersion "$env:PACKAGE_VERSION" `
            -AvaloniaVersion "$env:AVALONIA_SMOKE_VERSION"
          docker run --rm `
            -v "${{ github.workspace }}:/workspace" `
            -w /workspace `
            "${{ env.DOTNET_ALPINE_IMAGE }}" `
            sh -c "apk add --no-cache clang lld build-base zlib-dev fontconfig-dev && dotnet publish /workspace/artifacts/avalonia-smoke-src/OptrisStaticGraphicsSmoke.csproj -c Release -r $env:RID --configfile /workspace/artifacts/avalonia-smoke-src/NuGet.config /p:PublishAot=true /p:SelfContained=true /p:PublishSingleFile=true /p:StripSymbols=true /p:PublishDir=/workspace/artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/"

      - name: ✅ Verify no dynamic graphics libraries remain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishDir = "artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}"
          $blocked = Get-ChildItem -Path $publishDir -Recurse -File | Where-Object {
            $_.Name -in @("libSkiaSharp.dll", "libHarfBuzzSharp.dll", "av_libglesv2.dll", "libSkiaSharp.so", "libHarfBuzzSharp.so", "libSkiaSharp.dylib", "libHarfBuzzSharp.dylib")
          }
          if ($blocked) {
            $blocked | ForEach-Object { Write-Error "Unexpected dynamic graphics library: $($_.FullName)" }
            exit 1
          }
          Get-ChildItem -Path $publishDir -Recurse -File | ForEach-Object { $_.FullName }

      - name: ✅ Verify Windows executable architecture
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/OptrisStaticGraphicsSmoke.exe"
          $expectedMachine = @{
            "win-x64" = "8664 machine"
            "win-x86" = "14C machine"
            "win-arm64" = "AA64 machine"
          }[$env:RID]
          $headers = & dumpbin /headers $app | Out-String
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch [regex]::Escape($expectedMachine)) {
            throw "Expected $expectedMachine in PE headers for $app.`n$headers"
          }

      # GitHub's Windows runners have no GPU and no Vulkan ICD, so without this the Vulkan tier
      # could not be smoke-tested at all on the platform we care most about - the build-time symbol
      # assertion would prove the backend is PRESENT while nothing proved it RENDERS. lavapipe is
      # Mesa's CPU Vulkan driver; it is enough for the defect under test, because a Skia built
      # without Vulkan hands back a null GRContext no matter who provides the device.
      #
      # Pinned to one release and verified against the SHA-256 GitHub publishes for that asset, so
      # this cannot silently become a different binary. It is used ONLY here: it never enters a
      # package, and this job has no id-token permission, so it cannot reach the publishing path.
      # Linux gets the same driver from apt (mesa-vulkan-drivers) and needs no download.
      # No arm64 build exists, which is why win-arm64 is excluded from the smoke step below.
      - name: 🌋 Install lavapipe (software Vulkan)
        if: ${{ startsWith(matrix.rid, 'win-') && matrix.rid != 'win-arm64' && matrix.tier == 'Vulkan' }}
        shell: pwsh
        env:
          MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.1.7/mesa3d-26.1.7-release-msvc.7z
          MESA_SHA256: c6e90c3117233b66f7816df05026a5fb0f88eaf7829bd07a1724b981487ec0bb
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:MESA_SHA256) {
            throw "lavapipe archive checksum mismatch. Expected $env:MESA_SHA256, got $actual. Refusing to run an unverified driver."
          }
          # x86 ships its own build; the ICD manifest names the dll beside it, so both files move together.
          $arch = if ($env:RID -eq "win-x86") { "x86" } else { "x64" }
          $icdName = if ($arch -eq "x86") { "lvp_icd.x86.json" } else { "lvp_icd.x86_64.json" }
          $dest = Join-Path $env:RUNNER_TEMP "lavapipe"
          & 7z x $archive "-o$dest" -y "$arch/vulkan_lvp.dll" "$arch/$icdName" | Out-Null
          $icd = Join-Path $dest "$arch/$icdName"
          if (-not (Test-Path $icd)) { throw "lavapipe ICD not found at $icd after extraction." }
          # VK_DRIVER_FILES restricts the loader to exactly this ICD, so a passing Vulkan smoke here
          # is proof the software driver drew it rather than something else on the machine.
          "VK_DRIVER_FILES=$icd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "lavapipe ICD: $icd"

      # Windows, Linux and macOS all run the same script, so one check covers three platforms. The
      # app's exit code is the whole verdict: there is deliberately no "it was still running, so it
      # must be fine" branch, because a process that stays alive is precisely what the blank window
      # this repository exists to catch looks like. That branch is how the defect shipped upstream.
      - name: ▶️ Smoke the app, once per backend the tier promises
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') && matrix.rid != 'win-arm64' }}
        shell: bash
        run: sh scripts/run-smoke.sh

      - name: 🧪 Prove the smoke test can fail
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') && matrix.rid != 'win-arm64' }}
        shell: bash
        env:
          SMOKE_SELFTEST: "1"
        run: sh scripts/run-smoke.sh

      - name: ✅ Verify musl ELF dependencies
        if: ${{ startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e APP="artifacts/smoke-$TIER-$RID/OptrisStaticGraphicsSmoke" \
            alpine:3.23 \
            sh -c 'apk add --no-cache binutils pax-utils && readelf -l "$APP" | grep "Requesting program interpreter: /lib/ld-musl-" && scanelf -n "$APP" && ! scanelf -n "$APP" | grep -E "ld-linux|ld64.so"'

      # One container for both phases: the apk install costs far more than either run does, and a
      # negative control that is skipped whenever the real runs fail is not a control at all.
      - name: ▶️ Smoke the musl app per backend, then prove it can fail
        if: ${{ startsWith(matrix.rid, 'linux-musl-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/smoke-logs/$TIER-$RID"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SMOKE_TIER \
            -e SMOKE_BACKENDS \
            -e SMOKE_LABEL \
            -e SMOKE_DIR="/workspace/artifacts/smoke-$TIER-$RID" \
            -e SMOKE_LOG_DIR="/workspace/artifacts/smoke-logs/$TIER-$RID" \
            -e SMOKE_LAUNCHER="xvfb-run -a" \
            alpine:3.23 \
            sh -c 'apk add --no-cache xvfb-run libstdc++ libgcc fontconfig freetype ttf-dejavu \
                     libx11 libxcb libxext libxrender libxi libxrandr libxcursor libxfixes libxinerama libice libsm \
                     mesa-gl mesa-egl mesa-dri-gallium mesa-vulkan-swrast vulkan-loader || exit 1
                   fc-cache -f || exit 1
                   fc-match sans || exit 1
                   status=0
                   sh /workspace/scripts/run-smoke.sh || status=1
                   SMOKE_SELFTEST=1 sh /workspace/scripts/run-smoke.sh || status=1
                   exit $status'

      # A blank frame is the evidence, so the frames and the reports go up whether the job passed or
      # failed - a red run without the picture it read back is just an assertion nobody can check.
      - name: 📤 Upload smoke frames and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-evidence-${{ matrix.tier }}-${{ matrix.rid }}
          path: artifacts/smoke-logs/${{ matrix.tier }}-${{ matrix.rid }}/**
          if-no-files-found: warn

      - name: 📤 Upload smoke app
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-smoke-${{ matrix.tier }}-${{ matrix.rid }}
          path: artifacts/smoke-${{ matrix.tier }}-${{ matrix.rid }}/**
          if-no-files-found: error

  publish-nuget:
    name: 🚀 Publish to nuget.org
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Trusted Publishing: nuget.org trusts a short-lived OIDC token from this exact repository and
    # workflow file instead of a stored key, so there is no long-lived credential to leak, rotate,
    # or replay out of a log. id-token: write is what lets the job ask GitHub for that token; the
    # policy on nuget.org is pinned to owner/repo IDs, so deleting and recreating a repo of the
    # same name cannot inherit the trust. Renaming THIS FILE breaks publishing until the policy's
    # "Workflow File" is updated to match.
    permissions:
      id-token: write
      contents: read
    needs:
      - pack
      - pack-avalonia-native
      - verify-consumer-guard
      - smoke
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_nuget == true }}
    steps:
      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      # Immediately before the push, deliberately: the key nuget.org hands back is valid for one
      # hour, and one OIDC token buys exactly one key. Requesting it any earlier in the job just
      # spends part of that hour waiting.
      - name: 🔑 NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER || 'saitz-optris' }}

      - name: 🚀 Push
        working-directory: artifacts/nuget
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::The OIDC exchange returned no key. Check the Trusted Publishing policy on nuget.org matches owner Optris, repository Optris.StaticGraphics.Avalonia and workflow file release.yml, and that the login user is the nuget.org profile name."
            exit 1
          fi
          ls -la
          dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          if compgen -G "*.snupkg" > /dev/null; then
            dotnet nuget push "*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          fi

  release:
    name: 🏷️ GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - preflight
      - avalonia
      - pack
      - pack-avalonia-native
      - verify-consumer-guard
      - smoke
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_release == true }}
    permissions:
      contents: write
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 📥 Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          pattern: nuget-*
          path: release-artifacts/nuget
          merge-multiple: true

      - name: 📥 Download smoke artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: avalonia-smoke-*
          path: release-artifacts/smoke

      - name: 🧩 Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release-artifacts/nuget -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -exec cp {} release-files/ \;
          for dir in release-artifacts/smoke/avalonia-smoke-*; do
            [ -d "$dir" ] || continue
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release-files/$(basename "$dir").zip" .)
          done
          ls -la release-files

      - name: 🏷️ Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
          NATIVE_VERSION: ${{ needs.avalonia.outputs.package_version }}
          TIERS: ${{ needs.preflight.outputs.tiers }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v${PACKAGE_VERSION}"
          fi
          notes="Tiers: ${TIERS}. Optris.StaticGraphics.Avalonia.<Tier> ${PACKAGE_VERSION}, Optris.StaticGraphics.AvaloniaNative ${NATIVE_VERSION}. Each tier is a strict superset of the next: Vulkan ⊃ OpenGL ⊃ Software."
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-files/* --clobber
          else
            gh release create "$release_tag" release-files/* \
              --target "$GITHUB_SHA" \
              --title "Optris.StaticGraphics.Avalonia ${PACKAGE_VERSION}" \
              --notes "$notes"
          fi
