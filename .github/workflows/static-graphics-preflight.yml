name: 🔎 Preflight

# The packaging project is the single source of truth for the release version, so every
# entry point resolves it here instead of re-deriving it from tags or hand-typed inputs.

on:
  workflow_call:
    inputs:
      tiers:
        description: JSON array of tiers to build. Vulkan ⊃ OpenGL ⊃ Software.
        required: false
        default: '["Vulkan","OpenGL","Software"]'
        type: string
      skiasharp_version:
        description: Override the SkiaSharp version pinned by the packaging project
        required: false
        default: ""
        type: string
      build_rev:
        description: Override the fork build revision pinned by the packaging project
        required: false
        default: ""
        type: string
      allow_republish:
        description: Continue even when the resolved version is already on nuget.org
        required: false
        default: false
        type: boolean
      avalonia_version:
        description: >-
          Avalonia release line this build is for. Empty resolves the latest stable MAJOR, which is
          what these packages track. SkiaSharp is then taken from whatever that Avalonia depends on
          rather than pinned beside it.
        required: false
        default: ""
        type: string
    outputs:
      package_version:
        value: ${{ jobs.validate.outputs.package_version }}
      skiasharp_version:
        value: ${{ jobs.validate.outputs.skiasharp_version }}
      build_rev:
        value: ${{ jobs.validate.outputs.build_rev }}
      angle_branch:
        value: ${{ jobs.validate.outputs.angle_branch }}
      tiers:
        value: ${{ jobs.validate.outputs.tiers }}
      avalonia_version:
        value: ${{ jobs.validate.outputs.avalonia_version }}
  workflow_dispatch:
    inputs:
      tiers:
        description: JSON array of tiers to build
        required: false
        default: '["Vulkan","OpenGL","Software"]'
        type: string
      skiasharp_version:
        required: false
        default: ""
        type: string
      build_rev:
        required: false
        default: ""
        type: string
      allow_republish:
        required: false
        default: false
        type: boolean
      avalonia_version:
        required: false
        default: ""
        type: string

jobs:
  validate:
    name: 🔎 Versions & scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      package_version: ${{ steps.versions.outputs.package_version }}
      skiasharp_version: ${{ steps.versions.outputs.skiasharp_version }}
      build_rev: ${{ steps.versions.outputs.build_rev }}
      angle_branch: ${{ steps.versions.outputs.angle_branch }}
      tiers: ${{ steps.versions.outputs.tiers }}
      avalonia_version: ${{ steps.versions.outputs.avalonia_version }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 🔢 Resolve versions
        id: versions
        shell: bash
        env:
          INPUT_TIERS: ${{ inputs.tiers }}
          INPUT_SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
          INPUT_AVALONIA_VERSION: ${{ inputs.avalonia_version }}
          INPUT_BUILD_REV: ${{ inputs.build_rev }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import urllib.request

          def fail(message):
              sys.exit(f"::error::{message}")

          projects = sorted(pathlib.Path("NuGet/StaticGraphics").glob("*.csproj"))
          if len(projects) != 1:
              fail(f"Expected exactly one packaging project under NuGet/StaticGraphics, found: {projects}")
          project = projects[0]

          # Tier is a real build dimension of the packaging project, so evaluate properties with one
          # pinned; an unset Tier would leave PackageId and the generated props half-defined.
          result = subprocess.run(
              [
                  "dotnet", "msbuild", str(project), "-nologo", "-p:Tier=Vulkan",
                  "-getProperty:SkiaSharpVersion",
                  "-getProperty:BuildRev",
                  "-getProperty:OptrisStaticGraphicsAngleBranch",
              ],
              capture_output=True,
              text=True,
          )
          if result.returncode != 0:
              fail(f"Could not evaluate {project}:\n{result.stdout}\n{result.stderr}")

          start = result.stdout.find("{")
          if start < 0:
              fail(f"dotnet msbuild -getProperty returned no JSON:\n{result.stdout}")
          properties = json.loads(result.stdout[start:]).get("Properties", {})

          # Which Avalonia line is this package FOR, and therefore which SkiaSharp must it carry?
          # These two were pinned independently, and drifted: the packaging project said SkiaSharp
          # 3.119.4 while the smoke ran Avalonia 11.3.14, which depends on SkiaSharp 2.88.9. It
          # rendered anyway only because our own PackageReference on 3.119.4 is higher, so NuGet
          # silently upgraded Avalonia 11's Skia underneath it - a major native version, swapped
          # without a word, in the one test meant to prove the native layer works.
          # So SkiaSharp is no longer a number a human keeps in step. It is READ OFF the Avalonia
          # release line, which makes the two incapable of disagreeing.
          def http_json(url):
              with urllib.request.urlopen(url, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          avalonia_version = os.environ.get("INPUT_AVALONIA_VERSION", "").strip()
          if not avalonia_version:
              # Latest stable MAJOR. Avalonia maintains several majors at once and these packages
              # follow the newest; an older line needs its own SkiaSharp and so its own build.
              try:
                  versions = http_json("https://api.nuget.org/v3-flatcontainer/avalonia/index.json")["versions"]
              except Exception as error:
                  fail(f"Could not list Avalonia versions from nuget.org: {error}")
              stable = [v for v in versions if "-" not in v]
              if not stable:
                  fail("nuget.org returned no stable Avalonia versions.")
              newest_major = max(int(v.split(".")[0]) for v in stable)
              avalonia_version = [v for v in stable if int(v.split(".")[0]) == newest_major][-1]

          # Avalonia.Skia is where the SkiaSharp dependency is declared.
          nuspec_url = (
              "https://api.nuget.org/v3-flatcontainer/avalonia.skia/"
              f"{avalonia_version}/avalonia.skia.nuspec"
          )
          try:
              with urllib.request.urlopen(nuspec_url, timeout=60) as response:
                  nuspec = response.read().decode("utf-8")
          except Exception as error:
              fail(f"Could not read {nuspec_url}: {error}. Is {avalonia_version} a real Avalonia release?")
          found = re.search(r'id="SkiaSharp"\s+version="([^"]+)"', nuspec)
          if not found:
              fail(
                  f"Avalonia.Skia {avalonia_version} declares no SkiaSharp dependency, so there is "
                  "nothing to build these packages against. Refusing to guess one."
              )
          required_skiasharp = found.group(1)

          pinned = os.environ.get("INPUT_SKIASHARP_VERSION", "").strip()
          if pinned and pinned != required_skiasharp:
              fail(
                  f"SkiaSharp {pinned} was requested, but Avalonia {avalonia_version} depends on "
                  f"SkiaSharp {required_skiasharp}. Shipping the mismatch is how a consumer ends up "
                  "with managed bindings calling a native library they were not built for - and "
                  "NuGet will hide it, because highest-wins silently upgrades the loser. Build the "
                  "Avalonia line that wants this SkiaSharp, or drop the pin."
              )
          skiasharp_version = required_skiasharp
          print(f"Avalonia {avalonia_version} requires SkiaSharp {skiasharp_version}; building that.")
          build_rev = os.environ.get("INPUT_BUILD_REV") or properties.get("BuildRev", "")
          angle_branch = properties.get("OptrisStaticGraphicsAngleBranch", "")

          if not re.fullmatch(r"\d+\.\d+\.\d+", skiasharp_version):
              fail(f"SkiaSharpVersion must be three numeric parts, got: {skiasharp_version!r}")
          if not re.fullmatch(r"\d+", build_rev):
              fail(f"BuildRev must be numeric, got: {build_rev!r}")
          if not re.fullmatch(r"\d+", angle_branch):
              fail(f"OptrisStaticGraphicsAngleBranch must be a chromium branch number, got: {angle_branch!r}")

          package_version = f"{skiasharp_version}.{build_rev}"

          patch = pathlib.Path(f"External/NativeStatic/patches/angle-chromium-{angle_branch}.patch")
          if not patch.is_file():
              fail(f"Missing ANGLE patch for chromium/{angle_branch}: {patch}")

          tiers = json.loads(os.environ["INPUT_TIERS"] or '["Vulkan","OpenGL","Software"]')
          known = ["Vulkan", "OpenGL", "Software"]
          if not tiers or any(tier not in known for tier in tiers):
              fail(f"tiers must be a non-empty subset of {known}, got: {tiers}")
          tiers = [tier for tier in known if tier in tiers]

          # A release tag names the exact package version so that a mistyped tag cannot ship a
          # build under a version nobody reviewed.
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected = f"v{package_version}"
              actual = os.environ.get("GITHUB_REF_NAME")
              if actual != expected:
                  fail(f"Release tag must be {expected} to match the packaging project, got {actual}")

          outputs = {
              "package_version": package_version,
              "skiasharp_version": skiasharp_version,
              "build_rev": build_rev,
              "angle_branch": angle_branch,
              "tiers": json.dumps(tiers),
              # Emitted so the smoke builds against the SAME Avalonia this SkiaSharp came from.
              # Reading it back out of the step summary is how the drift stayed invisible before.
              "avalonia_version": avalonia_version,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("| Setting | Value |\n| --- | --- |\n")
              for key, value in outputs.items():
                  handle.write(f"| `{key}` | `{value}` |\n")
          PY

      - name: 🚦 Release guard
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.versions.outputs.package_version }}
          TIERS: ${{ steps.versions.outputs.tiers }}
          ALLOW_REPUBLISH: ${{ inputs.allow_republish }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          tiers = json.loads(os.environ["TIERS"])
          allow = os.environ.get("ALLOW_REPUBLISH") == "true"
          is_tag = os.environ.get("GITHUB_REF_TYPE") == "tag"

          def published(package_id):
              url = f"https://api.nuget.org/v3-flatcontainer/{package_id.lower()}/index.json"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return json.load(response).get("versions", [])
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return []
                  # A half-answered guard is worse than no guard: never assume "not published".
                  sys.exit(f"::error::nuget.org returned HTTP {error.code} for {package_id}; cannot tell whether {version} is already public.")
              except Exception as error:  # noqa: BLE001 - any transport failure is equally undecidable
                  sys.exit(f"::error::Could not reach nuget.org for {package_id} ({error}); cannot tell whether {version} is already public.")

          clashes = [tier for tier in tiers if version in published(f"Optris.StaticGraphics.Avalonia.{tier}")]
          if not clashes:
              print(f"{version} is unpublished for tiers {tiers}.")
              raise SystemExit(0)

          message = f"{version} is already on nuget.org for: {', '.join(clashes)}. Bump BuildRev."
          if is_tag and not allow:
              sys.exit(f"::error::{message}")
          print(f"::warning::{message} Continuing because this is not a tagged release or republish was allowed.")
          PY

      - name: 📐 Validate build scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-linux-static-graphics.sh
          bash -n scripts/build-macos-static-graphics.sh
          bash -n scripts/build-macos-avalonia-native-static.sh
          bash -n scripts/build-macos-font-preinit.sh
          bash -n scripts/run-smoke.sh

          # The GL-stub patch runs inside every Skia build on all three platforms, so a syntax
          # error in it is a syntax error in every one of them - discovered after the multi-GB
          # depot_tools/SkiaSharp sync rather than here.
          python3 -m py_compile scripts/patch-skia-gl-stubs.py

          # Git records the executable bit, and a contributor on Windows adding a script will not
          # set it - the file lands as 100644 and the Linux job dies with "Permission denied", exit
          # 126, twenty minutes into a matrix. That is what happened on the first full release run.
          # Cheap to check here, expensive to discover there.
          missing=""
          for script in scripts/*.sh; do
            mode="$(git ls-files -s "$script" | cut -d' ' -f1)"
            [ "$mode" = "100755" ] || missing="$missing $script($mode)"
          done
          if [ -n "$missing" ]; then
            echo "::error::Shell scripts are not executable in git:$missing. Fix with: git update-index --chmod=+x <script>"
            exit 1
          fi
          pwsh -NoProfile -Command '
            $failed = $false
            foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors.Count) { $failed = $true; Write-Host "::error file=$($file.FullName)::$($errors | Out-String)" }
            }
            if ($failed) { exit 1 }'

      - name: 🧬 Validate workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          failures = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  document = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as error:
                  failures.append(f"{path}: {error}")
                  continue
              # PyYAML resolves the bare `on` key to the boolean True.
              if not isinstance(document, dict) or not ({"on", True} & document.keys()):
                  failures.append(f"{path}: no trigger block")
              if "jobs" not in document:
                  failures.append(f"{path}: no jobs")
          if failures:
              sys.exit("::error::" + "; ".join(failures))
          print("All workflow files parse.")
          PY

      - name: 🏗️ Compile smoke project
        run: dotnet build Smoke/OptrisStaticGraphicsSmoke/OptrisStaticGraphicsSmoke.csproj -c Release -p:PublishAot=false

  smoke-harness:
    name: 🧪 Smoke harness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🧰 Install a display and the font stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-dejavu-core libfontconfig1 libfreetype6             libice6 libsm6 libx11-6 libxcb1 libxcursor1 libxext6 libxfixes3 libxi6 libxinerama1 libxrandr2 libxrender1

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 🏗️ Build the smoke app
        run: dotnet build Smoke/OptrisStaticGraphicsSmoke/OptrisStaticGraphicsSmoke.csproj -c Release -p:PublishAot=false -o artifacts/smoke-harness

      # No tier package is linked here, so this exercises the harness rather than a static build:
      # the Software backend through the ordinary dynamic SkiaSharp. The release workflow is what
      # forces Vulkan and OpenGL against the packages themselves.
      - name: ✅ A drawn frame passes
        env:
          SMOKE_TIER: Software
          SMOKE_BACKENDS: Software
          SMOKE_DIR: artifacts/smoke-harness
          SMOKE_LOG_DIR: artifacts/smoke-logs/preflight
          SMOKE_LABEL: preflight harness
          SMOKE_LAUNCHER: xvfb-run -a
        run: sh scripts/run-smoke.sh

      # The other half of the same claim, and the one that is easy to lose: a smoke test nobody has
      # watched fail is not evidence. A blank frame has to come back non-zero.
      - name: 🧪 A blank frame fails
        env:
          SMOKE_TIER: Software
          SMOKE_BACKENDS: Software
          SMOKE_DIR: artifacts/smoke-harness
          SMOKE_LOG_DIR: artifacts/smoke-logs/preflight
          SMOKE_LABEL: preflight harness
          SMOKE_LAUNCHER: xvfb-run -a
          SMOKE_SELFTEST: "1"
        run: sh scripts/run-smoke.sh

      - name: 📤 Upload the frame and the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-harness-evidence
          path: artifacts/smoke-logs/preflight/**
          if-no-files-found: warn

  upstream:
    name: 🌐 Upstream refs & ANGLE patch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: validate
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🌐 Validate upstream refs and ANGLE patch
        shell: bash
        env:
          SKIASHARP_VERSION: ${{ needs.validate.outputs.skiasharp_version }}
          ANGLE_BRANCH: ${{ needs.validate.outputs.angle_branch }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads https://github.com/mono/SkiaSharp.git "refs/heads/release/${SKIASHARP_VERSION}"
          git clone --depth 1 --branch "chromium/${ANGLE_BRANCH}" https://github.com/google/angle.git /tmp/optris-angle
          git -C /tmp/optris-angle apply --check "$GITHUB_WORKSPACE/External/NativeStatic/patches/angle-chromium-${ANGLE_BRANCH}.patch"

      # The same question the ANGLE `git apply --check` above answers, for the GL-stub patch:
      # does it still match the upstream it is written against? That patch edits a pinned
      # third-party checkout, so the failure that matters is a SkiaSharp bump moving the code out
      # from under it. The script asserts its own anchors and exits non-zero on a miss, so running
      # it against the real sources IS the check.
      # Only the two files it touches are fetched, at the exact skia commit this SkiaSharp release
      # pins, rather than cloning skia - which is gigabytes for two files.
      - name: 🩹 Validate the Skia GL-stub patch still applies
        shell: bash
        env:
          SKIASHARP_VERSION: ${{ needs.validate.outputs.skiasharp_version }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "release/${SKIASHARP_VERSION}" \
            https://github.com/mono/SkiaSharp.git /tmp/optris-skiasharp
          skia_sha="$(git -C /tmp/optris-skiasharp ls-tree HEAD externals/skia | awk '{print $3}')"
          if [ -z "$skia_sha" ]; then
            echo "::error::Could not read the externals/skia submodule commit from SkiaSharp release/${SKIASHARP_VERSION}."
            exit 1
          fi
          echo "SkiaSharp release/${SKIASHARP_VERSION} pins mono/skia at ${skia_sha}"

          mkdir -p /tmp/optris-skia-c/src/c
          for file in sk_types_priv.h gr_context.cpp; do
            curl -fsSL -o "/tmp/optris-skia-c/src/c/$file" \
              "https://raw.githubusercontent.com/mono/skia/${skia_sha}/src/c/$file"
          done

          python3 scripts/patch-skia-gl-stubs.py /tmp/optris-skia-c

          # Applying is necessary but not sufficient: a patch that ran and changed nothing would
          # also "succeed". Assert the macro and the re-guarded call sites are actually there.
          grep -q 'define SK_ONLY_GL' /tmp/optris-skia-c/src/c/sk_types_priv.h \
            || { echo "::error::patch reported success but SK_ONLY_GL is not defined"; exit 1; }
          grep -q 'SK_ONLY_GL(' /tmp/optris-skia-c/src/c/gr_context.cpp \
            || { echo "::error::patch reported success but no call site was re-guarded"; exit 1; }
