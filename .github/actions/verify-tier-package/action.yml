name: Verify tier package
description: Assert that a packed .nupkg publishes the shared tier contract and ships exactly the right archives.

inputs:
  tier:
    description: Vulkan, OpenGL or Software
    required: true
  package:
    description: Path to the .nupkg
    required: true
  angle_branch:
    description: >-
      Chromium branch the props file is expected to declare. Every caller reads this from the same
      OptrisStaticGraphicsAngleBranch property that dotnet pack uses to write that line, so on its
      own this is a self-check: it catches a props-generation bug and says nothing whatsoever about
      the archives in the package. Pass angle_branch_evidence to turn it into a real cross-check.
    required: true
  angle_branch_evidence:
    description: >-
      Path to a record written by whatever actually produced the ANGLE archives in this package,
      naming the branch they came from - for a repack, the buildTransitive props of the published
      package the payload was lifted out of. Either XML declaring OptrisStaticGraphicsAngleBranch,
      or a file holding the bare branch number. Given one, the branch the package advertises is
      compared against it and a mismatch fails the step; left empty, the branch is reported as
      unverified instead of quietly passing.
    required: false
    default: ""
  include_macos:
    description: >-
      Whether the osx RIDs are expected in this package. Must track verify-tier-payload's input of
      the same name: a run that skipped the macOS runners has no osx payload to pack, and requiring
      one here fails every Pack job on archives that were never produced.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: ✅ Verify package contract
      shell: bash
      env:
        TIER: ${{ inputs.tier }}
        PACKAGE: ${{ inputs.package }}
        ANGLE_BRANCH: ${{ inputs.angle_branch }}
        ANGLE_BRANCH_EVIDENCE: ${{ inputs.angle_branch_evidence }}
        INCLUDE_MACOS: ${{ inputs.include_macos }}
      run: |
        python3 - <<'PY'
        import os
        import pathlib
        import re
        import sys
        import xml.etree.ElementTree as ET
        import zipfile

        tier = os.environ["TIER"]
        angle_branch = os.environ["ANGLE_BRANCH"]
        angle_evidence = os.environ.get("ANGLE_BRANCH_EVIDENCE", "").strip()
        package_id = f"Optris.StaticGraphics.Avalonia.{tier}"
        expected_backends = {
            "Vulkan": {"Vulkan", "OpenGL", "Software"},
            "OpenGL": {"OpenGL", "Software"},
            "Software": {"Software"},
        }[tier]

        path = pathlib.Path(os.environ["PACKAGE"])
        if not path.is_file():
            sys.exit(f"::error::{path} does not exist")
        if not path.name.startswith(f"{package_id}."):
            sys.exit(f"::error::{path.name} is not a {package_id} package")

        def recorded_angle_branch(record):
            """The branch whoever built the archives wrote down, read from a file this pack step did
            not generate: XML declaring OptrisStaticGraphicsAngleBranch, or the bare number."""
            data = record.read_bytes()
            try:
                root = ET.fromstring(data)
            except ET.ParseError:
                return data.decode("utf-8", "replace").strip()
            declarations = [
                (element.text or "").strip()
                for element in root.iter()
                if element.tag.split("}")[-1] == "OptrisStaticGraphicsAngleBranch"
            ]
            return next((value for value in declarations if value), "")

        failures = []
        declared_branch = ""
        provenance = ""
        with zipfile.ZipFile(path) as archive:
            names = archive.namelist()
            if any("\\" in name for name in names):
                failures.append("package contains Windows-only backslash paths")

            props = f"buildTransitive/{package_id}.props"
            targets = f"buildTransitive/{package_id}.targets"
            for entry in (props, targets):
                if entry not in names:
                    failures.append(
                        f"missing {entry}: NuGet only auto-imports buildTransitive files named "
                        "after the package id, so the consumer would silently import nothing"
                    )

            if props in names:
                root = ET.fromstring(archive.read(props))
                declared = {
                    element.tag.split("}")[-1]: (element.text or "").strip()
                    for element in root.iter()
                }
                contract = {
                    "OptrisStaticGraphicsTier": tier,
                    "OptrisStaticGraphicsHasVulkan": str(tier == "Vulkan").lower(),
                    "OptrisStaticGraphicsHasAngle": str(tier in ("Vulkan", "OpenGL")).lower(),
                }
                if tier != "Software":
                    contract["OptrisStaticGraphicsAngleBranch"] = angle_branch
                for key, expected in contract.items():
                    if key not in declared:
                        failures.append(f"{props} does not publish {key}")
                    elif declared[key].lower() != expected.lower():
                        failures.append(f"{props}: {key} is {declared[key]!r}, expected {expected!r}")

                # Whether the branch this package advertises is the branch its archives were built
                # from is the one thing the loop above cannot tell you. angle_branch reaches us from
                # the same OptrisStaticGraphicsAngleBranch property dotnet pack used to write the
                # props line (csproj:34 -> csproj:36 -> csproj:124), so that comparison is a value
                # against its own origin: teeth against a props-generation bug, none against
                # provenance. Repack is where the two come apart - it lifts the payload out of an
                # already published package and repacks it under today's props, so a payload built
                # at chromium/7258 gets republished advertising 7922, and nothing in the archives,
                # the entry names or the payload contradicts it. So either an independent record is
                # supplied and compared, or the branch is called out below as unverified. It is
                # never reported as checked.
                declared_branch = declared.get("OptrisStaticGraphicsAngleBranch")
                if tier != "Software" and declared_branch is not None:
                    if not re.fullmatch(r"\d+", declared_branch):
                        failures.append(
                            f"{props}: OptrisStaticGraphicsAngleBranch is {declared_branch!r}, not a "
                            "chromium branch number - a tier that ships ANGLE has to name the branch "
                            "it came from, and two empty strings compare equal"
                        )
                    elif angle_evidence:
                        record = pathlib.Path(angle_evidence)
                        if not record.is_file():
                            failures.append(
                                f"angle_branch_evidence {record} does not exist, so the branch the "
                                "shipped ANGLE archives were built from cannot be read and no claim "
                                "about it can be verified"
                            )
                        else:
                            recorded = recorded_angle_branch(record)
                            if not re.fullmatch(r"\d+", recorded):
                                failures.append(
                                    f"angle_branch_evidence {record} records no chromium branch "
                                    f"(read {recorded!r}), so ANGLE provenance cannot be verified"
                                )
                            elif recorded != declared_branch:
                                failures.append(
                                    f"{props}: package advertises ANGLE chromium/{declared_branch}, "
                                    f"but {record} records the archives it ships as chromium/{recorded}"
                                )
                            else:
                                provenance = f"{record} (chromium/{recorded})"

                backends = declared.get("OptrisStaticGraphicsBackends")
                if backends is None:
                    failures.append(f"{props} does not publish OptrisStaticGraphicsBackends")
                elif {item for item in backends.split(";") if item} != expected_backends:
                    failures.append(
                        f"{props}: backends are {backends!r}, expected {';'.join(sorted(expected_backends))}"
                    )

            # The package is what consumers actually get, so presence and absence are asserted
            # here too and not only on the payload directory the pack step assembled.
            windows_rids = ["win-x64", "win-x86", "win-arm64"]
            unix_rids = ["linux-x64", "linux-arm64", "linux-musl-x64", "linux-musl-arm64"]
            if os.environ.get("INCLUDE_MACOS", "false").lower() == "true":
                unix_rids += ["osx-x64", "osx-arm64"]
            angle_stems = ("libANGLE_static.", "libGLESv2_static.")
            for rid in windows_rids + unix_rids:
                entries = [name for name in names if f"/{rid}/" in name]
                skia = "skia.lib" if rid in windows_rids else "libskia.a"
                if not any(name.endswith(f"/{rid}/native/{skia}") for name in entries):
                    failures.append(f"package ships no {skia} for {rid}")
                if rid == "win-x86" and not any(name.endswith("/win-x86/native/skia_x86_stdcall_thunks.lib") for name in entries):
                    failures.append("package ships no skia_x86_stdcall_thunks.lib for win-x86")
                angle = [name for name in entries if name.rsplit("/", 1)[-1].startswith(angle_stems)]
                allowed = tier in ("Vulkan", "OpenGL") and rid in windows_rids
                if allowed and len(angle) < 2:
                    failures.append(f"package must ship ANGLE for {rid} in tier {tier}, found {angle}")
                if not allowed and angle:
                    failures.append(f"package must not ship ANGLE for {rid} in tier {tier}, found {angle}")

        if failures:
            sys.exit("::error::" + "\n".join(failures))
        if tier == "Software":
            print(f"{path.name} satisfies the {tier} contract.")
        elif provenance:
            print(f"{path.name} satisfies the {tier} contract, ANGLE branch cross-checked against {provenance}.")
        else:
            # Name the half of the verdict that is missing. "I checked and it is fine" and "I could
            # not check" have to read differently in the log, or the next person takes the green
            # tick for a statement about the archives - which is the mistake this whole repository
            # exists to stop making.
            print(
                f"::warning::{path.name}: ANGLE branch NOT verified. The package advertises "
                f"chromium/{declared_branch}, and with no angle_branch_evidence given that value was "
                "only compared with the property that generated it. Nothing here read the archives, "
                "and nothing in them records a branch."
            )
            print(
                f"{path.name} satisfies the {tier} contract, except the ANGLE branch: "
                f"chromium/{declared_branch} is unverified, not confirmed."
            )
        PY
